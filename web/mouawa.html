.ibtn:hover{background:var(--bg-2)}
.tabs{display:flex}
.tabs button{flex:1;height:53px;position:relative;color:var(--fg-2);font-weight:500;padding:0 14px;white-space:nowrap;transition:background .15s}
.tabs button:hover{background:var(--bg-2)}
.tabs button[aria-selected="true"]{color:var(--fg);font-weight:700}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(56px,60%);height:4px;border-radius:2px;background:var(--accent)}
.tabs.scroll{overflow-x:auto;scrollbar-width:none}
.logo-mark{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-.04em}

/* Composer */
.composer{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
@media (min-width:700px){.composer{padding:12px 16px}}
.composer textarea{width:100%;border:0;background:transparent;resize:none;font-size:1.33rem;line-height:1.35;padding:8px 0;min-height:52px;overflow:hidden}
.composer textarea:focus{outline:none}
.composer textarea::placeholder{color:var(--fg-2)}
.c-tools{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:10px;border-top:1px solid var(--line);margin-top:6px}
.c-tools .left{display:flex;align-items:center;gap:0;margin-left:-8px;flex-wrap:wrap}
.c-tools .left .ibtn{color:var(--link)}
.c-tools .left .ibtn:hover{background:var(--accent-wash)}
.c-tools .right{display:flex;align-items:center;gap:12px}
.aud{display:inline-flex;align-items:center;gap:6px;color:var(--link);font-weight:600;font-size:.87rem;border-radius:16px;padding:4px 10px 4px 6px;margin:2px 0 6px -6px}
.aud select{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:var(--link);font-weight:600;font-size:.87rem;padding:2px 0;cursor:pointer}
.aud:hover{background:var(--accent-wash)}
.ring{position:relative;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring span{font-size:.72rem;font-variant-numeric:tabular-nums;color:var(--fg-2)}
.ring.warn span{color:#B7791F}
.ring.over span{color:var(--danger)}
.thumbs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:8px 0}
.thumb{position:relative;border-radius:14px;overflow:hidden;background:var(--bg-2)}
.thumb img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.thumb .x{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:16px;background:rgba(0,0,0,.7);color:#fff;display:flex;align-items:center;justify-content:center}
.thumb input{width:100%;border:0;border-top:1px solid var(--line);background:var(--bg-2);padding:8px 10px;font-size:.8rem}
.poll-edit{border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;margin:8px 0}
.poll-edit .row{display:flex;gap:8px;align-items:center}
.sched-line{display:flex;align-items:center;gap:8px;color:var(--fg-2);font-size:.87rem;margin:6px 0}

/* Posts */
.post{display:block;padding:var(--pad) 4px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s;position:relative}
@media (min-width:700px){.post{padding-inline:16px}}
.post:hover{background:color-mix(in srgb,var(--bg-2) 60%,transparent)}
.ctx-line{display:flex;align-items:center;gap:10px;font-size:.87rem;font-weight:600;color:var(--fg-2);margin:-2px 0 4px 26px}
.post-row{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px}
.post-av{position:relative}
.post.threaded .post-av::after{content:"";position:absolute;left:19px;top:46px;bottom:calc(-1 * var(--pad) - 4px);width:2px;background:var(--line)}
.post.threaded{border-bottom:0}
.av{width:40px;height:40px;border-radius:var(--av-r);background:var(--avc,#C7D2DC);color:#11161C;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;object-fit:cover;flex-shrink:0;overflow:hidden}
.av.s24{width:24px;height:24px;font-size:.6rem}
.av.s32{width:32px;height:32px;font-size:.72rem}
.av.s48{width:48px;height:48px}
.av.s128{width:128px;height:128px;font-size:2.4rem;border:4px solid var(--bg)}
@media (max-width:699px){.av.s128{width:88px;height:88px;font-size:1.7rem}}
.av.mesa{background:var(--fg);color:var(--bg)}
.post-head{display:flex;align-items:center;gap:4px;min-width:0;font-size:.95rem}
.post-head .nm{font-weight:700;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46%}
.post-head .nm:hover{text-decoration:underline}
.post-head .hd,.post-head .tm{color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post-head .hd{min-width:0;flex-shrink:1}
.post-head .tm:hover{text-decoration:underline}
.post-head .more{margin-left:auto;margin-right:-8px;width:34px;height:34px;color:var(--fg-2)}
.post-head .more:hover{background:var(--accent-wash);color:var(--link)}
.badge{display:inline-flex;flex-shrink:0}
.replying{font-size:.95rem;color:var(--fg-2)}
.p-text{font-size:1rem;line-height:1.42;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
.lnk{color:var(--link)}
.lnk:hover{text-decoration:underline}
.show-more{color:var(--link);font-weight:500;margin-top:2px}
.media{display:grid;gap:2px;border-radius:16px;overflow:hidden;border:1px solid var(--line);margin-top:12px}
.media.n1 img{max-height:520px;width:100%;object-fit:cover}
.media.n2,.media.n4{grid-template-columns:1fr 1fr;aspect-ratio:16/9}
.media.n3{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;aspect-ratio:16/9}
.media.n3 .m:first-child{grid-row:span 2}
.media .m{position:relative;min-height:0;background:var(--bg-2)}
.media .m img{display:block;width:100%;height:100%;object-fit:cover}
.alt-b{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.72);color:#fff;font-size:.7rem;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:.04em}
.poll{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.poll .opt{position:relative;height:36px;border-radius:8px;display:flex;align-items:center;padding:0 12px;overflow:hidden;font-weight:500;width:100%;text-align:left}
.poll .opt.vote{border:1px solid var(--accent);color:var(--link);border-radius:18px;justify-content:center;font-weight:700;transition:background .15s}
.poll .opt.vote:hover{background:var(--accent-wash)}
.poll .bar{position:absolute;inset:0 auto 0 0;background:var(--bg-3);border-radius:8px}
.poll .opt.win .bar{background:color-mix(in srgb,var(--accent) 30%,var(--bg-2))}
.poll .opt span{position:relative;display:flex;justify-content:space-between;width:100%;gap:8px}
.poll .foot{font-size:.87rem;color:var(--fg-2)}
.quote{border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-top:12px;transition:background .15s}
.quote:hover{background:var(--bg-2)}
.quote .p-text{font-size:.95rem}
.ctx-note{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin-top:12px;font-size:.92rem;background:var(--bg-2)}
.ctx-note b{display:block;font-weight:700;margin-bottom:2px}
.ctx-note svg{color:var(--official);flex-shrink:0;margin-top:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.78rem;color:var(--fg-2)}
.chip.acc{border-color:transparent;background:var(--accent-wash);color:var(--link)}
.acts{display:flex;justify-content:space-between;max-width:440px;margin:6px 0 -6px -8px}
.act{display:inline-flex;align-items:center;gap:2px;color:var(--fg-2);font-size:.82rem;font-variant-numeric:tabular-nums}
.act .ic{width:36px;height:36px;border-radius:18px;display:inline-flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
.act:hover{color:var(--link)} .act:hover .ic{background:var(--accent-wash)}
.act.rp:hover,.act.rp.on{color:var(--repost)} .act.rp:hover .ic{background:var(--repost-wash)}
.act.lk:hover,.act.lk.on{color:var(--like)} .act.lk:hover .ic{background:var(--like-wash)}
.act.lk.on svg{fill:currentColor}
.act.bm.on{color:var(--link)} .act.bm.on svg{fill:currentColor}
.act.lk.pop .ic{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.3)}100%{transform:scale(1)}}

/* Detail */
.detail{padding:12px 4px 0;border-bottom:1px solid var(--line)}
@media (min-width:700px){.detail{padding-inline:16px}}
.detail .who{display:flex;align-items:center;gap:12px}
.detail .who .nm{font-weight:700;display:flex;align-items:center;gap:4px}
.detail .p-text{font-size:1.2rem;line-height:1.45;margin-top:12px}
.detail .meta-line{color:var(--fg-2);padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.95rem}
.detail .counts{display:flex;flex-wrap:wrap;gap:4px 20px;padding:12px 0;border-bottom:1px solid var(--line);font-size:.95rem;color:var(--fg-2)}
.detail .counts b{color:var(--fg)}
.detail .acts{max-width:none;justify-content:space-around;margin:0;padding:4px 0}
.notes{margin:12px 4px;border:1px solid var(--line);border-radius:16px;overflow:hidden}
@media (min-width:700px){.notes{margin:12px 16px}}
.notes-h{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--bg-2);font-weight:700}
.notes-h svg{color:var(--official)}
.notes .tabs button{height:44px;font-size:.9rem}
.note{padding:12px 14px;border-top:1px solid var(--line)}
.note p{margin:0 0 6px}
.note small{color:var(--fg-2);font-size:.8rem}
.note.pending{background:var(--bg)}
.gate{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);color:var(--fg-2);font-size:.95rem}
@media (min-width:700px){.gate{padding:12px 16px}}
.gate .btn{margin-left:auto}
.collapse-row{width:100%;padding:16px;color:var(--link);border-bottom:1px solid var(--line);text-align:left}
.collapse-row:hover{background:var(--bg-2)}

/* Buttons & forms */
.btn{height:36px;padding:0 16px;border-radius:18px;font-weight:700;font-size:.93rem;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:filter .15s,background .15s}
.btn-acc{background:var(--accent);color:var(--on-accent)}
.btn-acc:hover{filter:brightness(1.06)}
.btn-fg{background:var(--fg);color:var(--bg)}
.btn-fg:hover{filter:brightness(.9)}
.btn-line{border:1px solid var(--line);color:var(--fg)}
.btn-line:hover{background:var(--bg-2)}
.btn-lg{height:48px;padding:0 24px;border-radius:24px;font-size:1rem}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btn-danger{background:var(--danger);color:#fff}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field .lab{font-weight:600;font-size:.9rem}
.hint{font-size:.82rem;color:var(--fg-2)}
.input{height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px;width:100%}
textarea.input{height:auto;padding:10px 12px;resize:vertical;line-height:1.45}
.input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.pre{position:relative}.pre span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--fg-2)}.pre .input{padding-left:28px}
.err{color:var(--danger);font-size:.85rem;font-weight:500;margin:0}
.searchbox{position:relative}
.searchbox svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--fg-2);pointer-events:none}
.searchbox input{width:100%;height:44px;border-radius:22px;border:1px solid transparent;background:var(--bg-2);padding:0 16px 0 48px}
.searchbox input:focus{outline:none;border-color:var(--accent);background:var(--bg)}

/* Side */
.side-in{position:sticky;top:env(safe-area-inset-top,0px);display:flex;flex-direction:column;gap:16px;padding-block:6px 24px}
.box{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.box h2{font-size:1.25rem;font-weight:800;padding:12px 16px}
.box-row{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;text-align:left;transition:background .15s}
.box-row:hover{background:var(--bg-2)}
.box-row .grow{flex:1;min-width:0}
.box-row .grow b,.box-row .grow span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.box-row .grow span{color:var(--fg-2);font-size:.9rem}
.box-more{display:block;width:100%;padding:16px;color:var(--link);text-align:left}
.box-more:hover{background:var(--bg-2)}
.trend .k{font-size:.8rem;color:var(--fg-2)}
.trend b{font-size:1rem}
.promo{background:var(--fg);color:var(--bg);border:0;padding:16px;display:flex;flex-direction:column;gap:8px}
.promo p{margin:0;opacity:.78;font-size:.93rem}
.foot{font-size:.8rem;color:var(--fg-2);display:flex;flex-wrap:wrap;gap:4px 12px;padding:0 16px}
.foot button:hover{text-decoration:underline}

/* People rows */
.person{display:flex;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);align-items:flex-start;cursor:pointer}
@media (min-width:700px){.person{padding:12px 16px}}
.person:hover{background:var(--bg-2)}
.person .grow{flex:1;min-width:0}
.person .grow .n{font-weight:700;display:flex;align-items:center;gap:4px}
.person .grow p{margin:4px 0 0}

/* Profile */
.banner{height:200px;background:var(--bnr,var(--accent));position:relative;overflow:hidden}
@media (max-width:699px){.banner{height:130px}}
.banner::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 20%,rgba(255,255,255,.25) 0 90px,transparent 91px)}
.pf{padding:12px 4px 0}
@media (min-width:700px){.pf{padding:12px 16px 0}}
.pf-top{display:flex;justify-content:space-between;align-items:flex-start;margin-top:-76px;position:relative}
@media (max-width:699px){.pf-top{margin-top:-56px}}
.pf-top .actions{display:flex;gap:8px;padding-top:80px}
@media (max-width:699px){.pf-top .actions{padding-top:60px}}
.pf h2{font-size:1.4rem;font-weight:800;display:flex;align-items:center;gap:6px;margin-top:10px}
.pf .bio{margin:12px 0 0;white-space:pre-wrap}
.pf .facts{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--fg-2);margin-top:12px;font-size:.95rem}
.pf .stats{display:flex;gap:20px;margin-top:12px;font-size:.95rem;color:var(--fg-2)}
.pf .stats b{color:var(--fg)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0 4px}
.card{border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.card big{font-weight:800;font-size:1.15rem}
.pinned{color:var(--fg-2)}

/* Panels / settings */
.sec{padding:16px 4px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.sec{padding:16px}}
.sec h2{font-size:1.2rem;font-weight:800}
.sec p{margin:0}
.toggle-row{display:flex;align-items:center;gap:14px}
.toggle-row .grow{flex:1;min-width:0}
.toggle-row .grow b{display:block;font-weight:600}
.toggle-row .grow span{font-size:.87rem;color:var(--fg-2)}
.switch{width:46px;height:28px;border-radius:14px;background:var(--bg-3);padding:3px;display:flex;flex-shrink:0;transition:background .2s}
.switch span{width:22px;height:22px;border-radius:11px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"] span{transform:translateX(18px)}
.swatches{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.sw{width:44px;height:44px;border-radius:22px;background:var(--c);display:flex;align-items:center;justify-content:center;color:var(--onc);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sw[aria-checked="true"],.sw:has(input:checked){box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--c)}
.sw:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:4px}
.custom-c{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border:1px dashed var(--line);border-radius:22px}
.custom-c input{width:28px;height:28px;border:0;padding:0;background:none;cursor:pointer}
.themes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:520px){.themes{grid-template-columns:repeat(4,minmax(0,1fr))}}
.th{height:64px;border-radius:12px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;background:var(--tb);color:var(--tf)}
.th[aria-checked="true"]{outline:2px solid var(--accent);outline-offset:2px}
.th .r{width:18px;height:18px;border-radius:9px;border:2px solid currentColor;display:inline-flex;align-items:center;justify-content:center}
.th[aria-checked="true"] .r{background:var(--accent);border-color:var(--accent)}
.size{display:flex;align-items:center;gap:14px}
.size input[type=range]{flex:1;accent-color:var(--accent);height:28px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{height:40px;padding:0 16px;border-radius:20px;border:1px solid var(--line);font-weight:500}
.seg button[aria-checked="true"]{background:var(--fg);color:var(--bg);border-color:transparent;font-weight:700}
.preview{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.preview .post{cursor:default;border-bottom:0}
.list-row{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left}
@media (min-width:700px){.list-row{padding:14px 16px}}
.list-row:hover{background:var(--bg-2)}
.list-ic{width:48px;height:48px;border-radius:12px;background:var(--accent-wash);color:var(--link);display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* Notifications */
.notif{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
@media (min-width:700px){.notif{padding:12px 16px}}
.notif:hover{background:var(--bg-2)}
.notif.unread{background:var(--accent-wash)}
.notif .nic{display:flex;justify-content:flex-end;padding-top:2px}
.notif .nic.lk{color:var(--like)} .notif .nic.rp{color:var(--repost)} .notif .nic.fl,.notif .nic.ct{color:var(--link)}
.notif p{margin:6px 0 0;color:var(--fg-2);overflow-wrap:anywhere}

/* Deck */
.deck{display:flex;gap:12px;overflow-x:auto;padding:12px 0 16px;align-items:flex-start}
.col{width:350px;flex-shrink:0;border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;max-height:calc(100dvh - 110px);overflow:hidden}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:6px 6px 6px 16px;border-bottom:1px solid var(--line);font-weight:800}
.col-b{overflow-y:auto}
.col-b .post,.col-b .notif{padding-inline:12px}
.col.add{border-style:dashed;padding:16px;gap:12px}

/* Empty, misc */
.empty{padding:40px 24px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;max-width:420px;margin:0 auto}
.empty h2{font-size:1.9rem;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.empty p{margin:0;color:var(--fg-2)}
.banner-note{margin:12px 4px;border-radius:16px;padding:12px 14px;background:var(--warn-wash);display:flex;flex-direction:column;gap:8px}
@media (min-width:700px){.banner-note{margin:12px 16px}}
.banner-note p{margin:0}
.banner-note .row{display:flex;gap:8px;flex-wrap:wrap}
.newpill{position:sticky;top:calc(env(safe-area-inset-top,0px) + 116px);z-index:15;display:flex;justify-content:center;height:0;overflow:visible}
.newpill button{height:36px;margin-top:8px;padding:0 16px;border-radius:18px;background:var(--accent);color:var(--on-accent);font-weight:700;box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:6px}
.skel{height:96px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,var(--bg) 0,var(--bg-2) 50%,var(--bg) 100%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.step{display:grid;grid-template-columns:32px minmax(0,1fr);gap:14px}
.step-n{width:32px;height:32px;border-radius:16px;background:var(--fg);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:800}
.step-n.done{background:var(--repost);color:#fff}
.step-b{display:flex;flex-direction:column;gap:10px;min-width:0}
.step-b h3{font-size:1.06rem;font-weight:700}
.progress{height:6px;border-radius:3px;background:var(--bg-3);overflow:hidden}

.dm-sub{display:flex;align-items:center;gap:4px;font-size:.8rem;color:var(--fg-2);white-space:nowrap;overflow:hidden}

.dm-msg.first{margin-top:10px}
.dm-msg.me{align-items:flex-end}.dm-msg.them{align-items:flex-start}
.dm-from{font-size:.78rem;color:var(--fg-2);margin:0 0 3px 44px}

.dm-msg.them.first:not(.last) .dm-bub{border-bottom-left-radius:6px}
.dm-msg.them:not(.first):not(.last) .dm-bub{border-top-left-radius:6px;border-bottom-left-radius:6px}
.dm-msg.them.last:not(.first) .dm-bub{border-top-left-radius:6px}
.dm-msg.me.first:not(.last) .dm-bub{border-bottom-right-radius:6px}
.dm-msg.me:not(.first):not(.last) .dm-bub{border-top-right-radius:6px;border-bottom-right-radius:6px}
.dm-msg.me.last:not(.first) .dm-bub{border-top-right-radius:6px}
.dm-gone{font-style:italic;opacity:.8;display:inline-flex;align-items:center;gap:4px}
.dm-quote{display:block;border-left:3px solid currentColor;padding:2px 0 2px 8px;opacity:.85;font-size:.88rem}

.dm-post{display:flex;flex-direction:column;gap:4px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:14px;padding:8px 10px;cursor:pointer;white-space:normal}
.dm-post .p-text{font-size:.9rem}
.dm-tools{display:none;align-items:center;gap:0;background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:0 2px;box-shadow:var(--shadow);align-self:center}

.dm-line:hover .dm-tools,.dm-line:focus-within .dm-tools{display:inline-flex}
@media (hover:none){.dm-msg.picked .dm-tools{display:inline-flex}}
.dm-picker{display:flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:4px;box-shadow:var(--shadow);margin:4px 0}
.dm-picker button{width:36px;height:36px;border-radius:18px;font-size:1.25rem}
.dm-picker button:hover{background:var(--bg-2);transform:scale(1.15)}
.dm-reacts{display:flex;gap:4px;margin:-6px 8px 0;position:relative;z-index:1}

.dm-reacts button{height:24px;padding:0 7px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:.85rem;display:inline-flex;align-items:center;gap:3px}

.dm-meta{font-size:.75rem;color:var(--fg-2);margin:3px 4px 0}
.dm-msg.them .dm-meta{margin-left:46px}
.dm-typing{min-height:0;font-size:.82rem;color:var(--link);font-weight:600;padding:0 20px;height:0;overflow:hidden;transition:height .15s}

.dm-input-row textarea:focus{outline:none}
.dm-send{width:38px;height:38px;border-radius:19px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}

.dm-info{width:min(340px,100%);border-left:1px solid var(--line);overflow-y:auto;padding:12px 16px 20px;display:flex;flex-direction:column;gap:16px;background:var(--bg)}

.dm-info-h{display:flex;justify-content:space-between;align-items:center;font-size:1.1rem}
.dm-code{font-family:ui-monospace,Menlo,monospace;font-size:1rem;letter-spacing:.06em;background:var(--bg-2);border-radius:10px;padding:10px 12px;line-height:1.7;word-spacing:.3em}
.pick-row{display:flex;align-items:center;gap:12px;width:100%;padding:10px 4px;text-align:left;border-radius:12px}

.pro-g{display:flex;flex-direction:column;gap:2px}

.sel{user-select:all;overflow-wrap:anywhere}
.sheet.wiz{max-width:600px;height:min(92dvh,760px);display:flex;flex-direction:column;overflow:hidden;padding-bottom:0}

.wiz-body{flex:1;overflow-y:auto;padding:4px 20px 12px}
@media (min-width:700px){.wiz-intro{padding:22px 32px 12px}.wiz-body{padding:4px 32px 12px}}

.wiz-sel{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}

.wiz-sel span{font-size:.82rem}

.wiz-preview{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
/* Stories */

.sv-bars{display:flex;gap:4px;padding:10px 10px 0}

.ev-who .av{border:2px solid var(--bg);margin-left:-6px}

.req-banner .grow,.eng-row .grow{flex:1;min-width:0;display:flex;flex-direction:column}

/* search */
.srch-row{display:flex;gap:6px;align-items:center;padding:6px 4px 8px}

.srch-chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}

.news-note{display:flex;align-items:center;gap:6px;margin:0;padding:10px 16px;border-bottom:1px solid var(--line);font-size:.85rem}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

/* edit profile */
.pf2-banner{position:relative;margin:0 -16px;border-radius:0}

.pf2-bb{position:absolute;inset:auto 12px 12px auto;display:flex;gap:8px}
/* Spaces */
.sp-strip{display:flex;gap:10px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none}
.sp-card{flex:0 0 260px;display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px;border-radius:18px;background:linear-gradient(135deg,var(--bg-3),var(--bg-2));border:1px solid var(--line);min-height:132px;transition:transform .15s}

.sp-card.live{background:linear-gradient(135deg,var(--accent),color-mix(in oklab,var(--accent) 55%,#E0186F));color:var(--on-accent);border-color:transparent}
.sp-card.big{flex:initial}
.sp-tag{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:800;letter-spacing:.06em}

.sp-meta{font-size:.8rem;opacity:.85}
.sp-eq{display:inline-flex;align-items:flex-end;gap:2px;height:12px}

.sp-eq b:nth-child(2){animation-delay:.2s}.sp-eq b:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:4px}50%{height:12px}}

.sp-sec{padding:16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.sp-sec h2{font-size:1.2rem;font-weight:800}
.sp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.sp-livepill{display:inline-block;background:var(--danger);color:#fff;font-size:.7rem;font-weight:800;padding:1px 6px;border-radius:4px;letter-spacing:.05em}
.sp-room{padding:16px;display:flex;flex-direction:column;gap:14px}
.sp-hero{display:flex;flex-direction:column;gap:6px;align-items:flex-start}

.sp-sched{display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding:20px;border-radius:18px;background:var(--bg-2)}

.sp-people{display:flex;flex-direction:column;gap:10px}
.sp-row{display:flex;flex-wrap:wrap;gap:14px}

.sp-sub{font-size:.8rem;font-weight:700;color:var(--fg-2)}
.sp-p{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;width:84px;text-align:center}
.sp-row.sm .sp-p{width:68px}
.sp-p.away{opacity:.45}

.sp-p>span:not(.sp-hand){font-size:.72rem;color:var(--fg-2)}
.sp-p .lnk{font-size:.72rem;font-weight:700}
.sp-hand{position:absolute;top:-4px;right:8px;font-size:1.1rem}
.sp-feedwrap{position:relative}
.sp-feed{border:1px solid var(--line);border-radius:18px;max-height:min(52vh,460px);min-height:180px;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.sp-empty{margin:auto;text-align:center;max-width:320px}
.sp-m{display:flex;gap:8px;align-items:flex-start}

.sp-who{font-weight:700;font-size:.85rem}

.sp-float{position:absolute;inset:auto 0 0 0;height:100%;pointer-events:none;overflow:hidden}
.sp-fl{position:absolute;bottom:8px;font-size:1.8rem;animation:floatup 2.6s ease-out forwards}
@keyframes floatup{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1;transform:translateY(-20px) scale(1)}100%{transform:translateY(-260px) scale(1.1);opacity:0}}

.sp-react{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

.sp-handbtn{display:inline-flex;align-items:center;gap:6px;height:42px;padding:0 16px;border-radius:21px;border:1px solid var(--line);font-weight:700;margin-left:auto}
.sp-handbtn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent}
.sp-form{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp-form .input{flex:1;min-width:180px}
.seg.sm button{height:34px;padding:0 12px;font-size:.85rem}
/* Ask Mouawa */
.ask{display:flex;flex-direction:column;min-height:calc(100dvh - 140px)}

.ask-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.ask-m.me{align-self:flex-end;max-width:82%;background:var(--accent);color:var(--on-accent);padding:10px 14px;border-radius:18px 18px 4px 18px}

.ask-m.ai{display:flex;gap:10px;align-items:flex-start;max-width:100%}

.ask-body{min-width:0;line-height:1.5;overflow-wrap:anywhere}

.ask-body li{margin:2px 0}
.ask-status{margin:0 16px;color:var(--fg-2);font-size:.87rem;font-style:italic}
.ask-form{position:sticky;bottom:calc(58px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end;padding:10px 12px;margin:0 12px 8px;border:1px solid var(--line);border-radius:22px;background:var(--bg);box-shadow:var(--shadow)}

.job-filters{padding:10px 16px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}

a.btn{display:inline-flex;align-items:center;justify-content:center}

.mod-r{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}

/* ---- Cleanup round ---- */
/* press feedback */
.btn,.ibtn,.nav-item,.nav-post,#tabbar button,#fab,.chipbtn,.dr-item,.menu-i,.act .ic,.tabs button,.dial-b{transition:transform .12s ease,background .15s,color .15s,opacity .2s}
.btn:active,.ibtn:active,.nav-post:active,#fab:active,.chipbtn:active,.dial-b:active{transform:scale(.95)}
#tabbar button:active svg,.act:active .ic{transform:scale(.88)}
.menu-i:active,.dr-item:active,.dr-sub:active{background:var(--bg-3)}
/* tabs */
.tabs button[aria-selected="true"]::after{animation:tabin .25s cubic-bezier(.2,.8,.2,1)}
@keyframes tabin{from{width:0;opacity:.4}}
/* tab bar */
#tabbar{justify-content:space-around;padding-inline:4px;transition:opacity .25s,transform .25s}
#tabbar button{flex:1;max-width:76px;height:50px;color:var(--fg)}
#tabbar button[aria-current="page"] svg{animation:tabpop .3s ease}
@keyframes tabpop{40%{transform:scale(1.14)}}
#tabbar .dot-badge{left:auto;right:calc(50% - 22px);top:5px}
/* hide chrome on scroll (phones) */
@media (max-width:699px){
  .head{transition:transform .25s ease}
  body.hide-chrome .head{transform:translateY(calc(-100% - env(safe-area-inset-top,0px)))}
  body.hide-chrome #tabbar{opacity:.45}
  body.hide-chrome #fab{opacity:.55;transform:scale(.92)}
}
#fab{transition:transform .2s,opacity .25s,box-shadow .2s}
#fab[hidden],#tabbar[hidden]{display:none!important}
#fab:hover{box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 45%,transparent)}
/* like / repost / bookmark */
.act.rp.pop .ic svg{animation:spin .5s cubic-bezier(.3,.7,.3,1)}
@keyframes spin{from{transform:rotate(-180deg) scale(.6)}}
.act.bm.pop .ic svg{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.35)}}
.act.lk.pop .ic svg{animation:likepop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes likepop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.burst{position:fixed;z-index:70;width:0;height:0;pointer-events:none}
.burst .ring{position:absolute;left:-18px;top:-18px;width:36px;height:36px;border-radius:50%;border:3px solid var(--bc);animation:ring .5s ease-out forwards}
.burst .dot{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:var(--bc);transform:rotate(var(--a)) translateY(0);animation:dot .6s ease-out forwards}
.burst .dot:nth-child(odd){background:color-mix(in srgb,var(--bc) 55%,#FFC83D)}
@keyframes ring{0%{transform:scale(.2);opacity:1;border-width:10px}100%{transform:scale(1.3);opacity:0;border-width:0}}
@keyframes dot{0%{transform:rotate(var(--a)) translateY(-6px) scale(1)}100%{transform:rotate(var(--a)) translateY(-26px) scale(0);opacity:.2}}
/* pull to refresh */
.ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:40;transform:translate(-50%,-10px);opacity:0;transition:transform .2s,opacity .2s;pointer-events:none}
.ptr-b{width:40px;height:40px;border-radius:20px;background:var(--bg);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;color:var(--fg-2);transition:transform .2s,color .2s}
.ptr.ready .ptr-b{color:var(--accent);transform:rotate(180deg)}
.ptr.spin .ptr-b{color:var(--accent);animation:ptrspin .6s linear infinite}
@keyframes ptrspin{to{transform:rotate(360deg)}}
/* page transitions */
::view-transition-old(root),::view-transition-new(root){animation-duration:.16s}
/* skeleton */
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
/* toast */

@keyframes toastin{from{transform:translate(-50%,12px);opacity:0}}

/* new posts pill */

.np-av{display:flex}

.np-av .av:last-child{margin-right:2px}

/* home */
.logo-mark{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:20px}
.calm-chip{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 16px;background:var(--accent-wash);font-size:.87rem;font-weight:600;border-bottom:1px solid var(--line)}
.calm-chip span{display:inline-flex;align-items:center;gap:6px}
.feed-ai{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--accent-wash);color:var(--fg);text-align:left}

.feed-ai .grow{flex:1;display:flex;flex-direction:column}

@keyframes drin{from{transform:translateX(-100%)}}
.dr{display:flex;flex-direction:column;min-height:100%}

.dr-stats{display:flex;gap:16px;padding:10px 18px 6px;font-size:.93rem;color:var(--fg-2)}

.more-g{display:flex;flex-direction:column;padding-bottom:10px}

.more-foot{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px;border-top:1px solid var(--line);margin-top:6px;font-size:.85rem}

.dial{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-end;gap:14px}

/* =====================================================================
   Larkmoor design system, applied to Mouawa
   Tokens: Larkmoor v0.2.0 (Evergreen, Evergreen dark, Harbor dark).
   Type: Inter (the owner's chosen font) throughout.
   ===================================================================== */
:root{
  --lm-ease:cubic-bezier(.22,.8,.2,1); --lm-fast:150ms; --lm-base:250ms; --lm-slow:400ms;
  --lm-r-sm:4px; --lm-r-md:12px; --lm-r-lg:16px; --lm-r-xl:24px;
  --lm-elev-1:0 30px 60px -40px rgb(20 36 28 / .35);
  --lm-elev-2:0 10px 24px -14px rgb(20 36 28 / .55);
  --lm-pop:0 30px 80px -20px rgb(0 0 0 / .28),0 0 0 1px var(--line);
}
/* Evergreen (light) */
:root,:root[data-mesa="light"]{
  --bg:#ffffff; --bg-2:#f5f7f5; --bg-3:#eef2ef; --surface:#ffffff;
  --line:rgb(20 36 28 / .11); --line-strong:rgb(20 36 28 / .2);
  --fg:#14241c; --fg-sec:#3d4d44; --fg-2:#5f6e65;
  --accent:#1f7a4f; --accent-hover:#17603e; --on-accent:#ffffff;
  --link:#1f7a4f; --label:#7a5c24; --gold:#7a5c24;
  --action:#14241c; --on-action:#ffffff;
  --like:#c2255c; --like-wash:rgb(194 37 92 / .1); --repost:#1a7448; --repost-wash:rgb(26 116 72 / .1);
  --official:#1f7a4f; --danger:#b3261e; --success:#1a7448; --warn-wash:#fbf6ea;
  --accent-wash:rgb(31 122 79 / .1);
  --overlay:rgb(10 16 13 / .5); --glass:rgb(255 255 255 / .78);
  --shadow:0 30px 80px -20px rgb(0 0 0 / .25),0 2px 6px rgb(20 36 28 / .06);
  --card:#ffffff; --card-sh:var(--lm-elev-1); --card-sh-h:0 30px 60px -34px rgb(20 36 28 / .45);
  color-scheme:light;
}
/* Evergreen dark */
@media (prefers-color-scheme: dark){:root:not([data-mesa]){
  --bg:#0f1d16; --bg-2:#14241c; --bg-3:#1a2e24; --surface:#1a2e24;
  --line:rgb(244 241 232 / .1); --line-strong:rgb(244 241 232 / .22);
  --fg:#f4f1e8; --fg-sec:#c9d4cd; --fg-2:#95aa9e;
  --accent:#7ee2b8; --accent-hover:#ffffff; --on-accent:#0f1d16;
  --link:#7ee2b8; --label:#e6c88f; --gold:#e6c88f;
  --action:#f4f1e8; --on-action:#0f1d16;
  --like:#ff7aa2; --like-wash:rgb(255 122 162 / .12); --repost:#7ee2b8; --repost-wash:rgb(126 226 184 / .12);
  --official:#7ee2b8; --danger:#ffb3a6; --success:#7ee2b8; --warn-wash:#2a2618;
  --accent-wash:rgb(126 226 184 / .12);
  --overlay:rgb(0 0 0 / .6); --glass:rgb(15 29 22 / .85);
  --shadow:0 30px 80px -20px rgb(0 0 0 / .6);
  --card:#14241c; --card-sh:none; --card-sh-h:0 0 0 1px var(--line-strong);
  color-scheme:dark}}
:root[data-mesa="dark"]{
  --bg:#0f1d16; --bg-2:#14241c; --bg-3:#1a2e24; --surface:#1a2e24;
  --line:rgb(244 241 232 / .1); --line-strong:rgb(244 241 232 / .22);
  --fg:#f4f1e8; --fg-sec:#c9d4cd; --fg-2:#95aa9e;
  --accent:#7ee2b8; --accent-hover:#ffffff; --on-accent:#0f1d16;
  --link:#7ee2b8; --label:#e6c88f; --gold:#e6c88f;
  --action:#f4f1e8; --on-action:#0f1d16;
  --like:#ff7aa2; --like-wash:rgb(255 122 162 / .12); --repost:#7ee2b8; --repost-wash:rgb(126 226 184 / .12);
  --official:#7ee2b8; --danger:#ffb3a6; --success:#7ee2b8; --warn-wash:#2a2618;
  --accent-wash:rgb(126 226 184 / .12);
  --overlay:rgb(0 0 0 / .6); --glass:rgb(15 29 22 / .85);
  --shadow:0 30px 80px -20px rgb(0 0 0 / .6);
  --card:#14241c; --card-sh:none; --card-sh-h:0 0 0 1px var(--line-strong);
  color-scheme:dark}
/* Harbor dark (the "Dim" theme) */
:root[data-mesa="dim"]{
  --bg:#121c38; --bg-2:#1d2b53; --bg-3:#28365e; --surface:#28365e;
  --line:rgb(251 247 241 / .12); --line-strong:rgb(251 247 241 / .24);
  --fg:#fbf7f1; --fg-sec:#e3e8f3; --fg-2:#a9b6d6;
  --accent:#f0a58d; --accent-hover:#ffffff; --on-accent:#121c38;
  --link:#f0a58d; --label:#f0a58d; --gold:#e6c88f;
  --action:#fbf7f1; --on-action:#121c38;
  --like:#ff8fb1; --like-wash:rgb(255 143 177 / .14); --repost:#7ee2b8; --repost-wash:rgb(126 226 184 / .14);
  --official:#7ee2b8; --danger:#ffb3a6; --success:#7ee2b8; --warn-wash:#2c2a3a;
  --accent-wash:rgb(240 165 141 / .14);
  --overlay:rgb(5 8 20 / .6); --glass:rgb(18 28 56 / .88);
  --shadow:0 30px 80px -20px rgb(0 0 0 / .6);
  --card:#1d2b53; --card-sh:none; --card-sh-h:0 0 0 1px var(--line-strong);
  color-scheme:dark}
/* A custom accent picked in Appearance keeps working: links follow it. */
:root[data-accent="custom"]{--link:color-mix(in srgb,var(--accent) 78%,var(--fg));--accent-wash:color-mix(in srgb,var(--accent) 12%,transparent);--accent-hover:color-mix(in srgb,var(--accent) 82%,#000)}

/* ---------- Base ---------- */
body{font-feature-settings:"ss01","cv11";letter-spacing:-.005em}
::selection{background:var(--accent);color:var(--on-accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:var(--lm-r-sm)}
.num,.act span,.stats,.dr-stats,.eng-stats{font-variant-numeric:tabular-nums}

/* ---------- Buttons (Larkmoor: pill, 44 / 36, medium weight) ---------- */
.btn{height:36px;padding:0 16px;border-radius:999px;border:1px solid transparent;font-weight:600;font-size:.9rem;letter-spacing:-.005em;transition:background-color var(--lm-fast) var(--lm-ease),color var(--lm-fast) var(--lm-ease),border-color var(--lm-fast) var(--lm-ease),box-shadow var(--lm-base) var(--lm-ease),transform var(--lm-base) var(--lm-ease)}
.btn-lg{height:44px;padding:0 24px;font-size:.95rem}
.btn:active{transform:scale(.97)}
.btn-fg{background:var(--action);color:var(--on-action);box-shadow:var(--lm-elev-2)}
.btn-fg:hover{background:var(--accent);color:var(--on-accent);filter:none}
.btn-acc{background:var(--accent);color:var(--on-accent);box-shadow:var(--lm-elev-2)}
.btn-acc:hover{background:var(--accent-hover);filter:none}
:root:not([data-mesa="light"]) .btn-acc:hover{color:var(--on-accent)}
.btn-line{border-color:var(--line-strong);background:transparent;color:var(--fg)}
.btn-line:hover{background:transparent;border-color:var(--accent);color:var(--link)}
.btn-danger{background:var(--danger);color:#fff;border-color:transparent}
:root:not([data-mesa="light"]) .btn-danger{color:#1a0b09}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.55;box-shadow:none}
.nav-post{background:var(--action);color:var(--on-action);box-shadow:var(--lm-elev-2);font-weight:600;letter-spacing:-.005em;transition:background-color var(--lm-fast) var(--lm-ease),transform var(--lm-base) var(--lm-ease)}
.nav-post:hover{background:var(--accent);color:var(--on-accent);filter:none}
#fab{background:var(--action);color:var(--on-action);box-shadow:0 16px 32px -14px rgb(0 0 0 / .55)}
.dial-i.main .dial-b,.dial-i.main .dial-l{background:var(--action);color:var(--on-action)}
.ibtn:hover{background:var(--bg-2)}

/* ---------- Form fields ---------- */
.field{gap:8px}
.field>label,.field .lab{font-size:.875rem;font-weight:500;color:var(--fg)}
.input{min-height:44px;height:auto;padding:10px 14px;border:1px solid var(--line-strong);border-radius:var(--lm-r-md);background:var(--surface,var(--bg));font-size:16px;transition:border-color var(--lm-fast),box-shadow var(--lm-fast)}
select.input{height:44px;padding-block:0}
.input:hover{border-color:var(--fg-2)}
.input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.input::placeholder,textarea::placeholder{color:var(--fg-2)}
.err{color:var(--danger)}
.err:not(:empty)::before{content:"!";display:inline-grid;place-items:center;width:1.15em;height:1.15em;margin-right:6px;border-radius:50%;background:currentColor;color:var(--bg);font-weight:700;font-size:.8em;vertical-align:.08em}
.check input,.rep-row input{accent-color:var(--accent)}
.searchbox input{height:44px;border:1px solid var(--line-strong);background:var(--bg-2);font-size:16px;transition:border-color var(--lm-fast),box-shadow var(--lm-fast)}
.searchbox input:focus{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:2px;background:var(--bg)}
.ask-form{border-color:var(--line-strong);background:var(--bg-2);box-shadow:var(--lm-elev-1)}
.ask-form:focus-within{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:2px}

/* ---------- Switch ---------- */
.switch{background:var(--bg-3);box-shadow:inset 0 0 0 1px var(--line);transition:background var(--lm-base) var(--lm-ease)}
.switch span{transition:transform var(--lm-slow) cubic-bezier(.3,1.3,.5,1);box-shadow:0 4px 12px -4px rgb(0 0 0 / .35)}
.switch[aria-checked="true"]{background:var(--accent);box-shadow:none}
.switch[aria-checked="true"] span{background:var(--on-accent)}

/* ---------- Segmented control ---------- */
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:4px;border-radius:22px;background:var(--bg-3);box-shadow:inset 0 0 0 1px var(--line);align-self:flex-start;max-width:100%}
.seg button{height:36px;padding:0 14px;border:0;border-radius:999px;font-size:.875rem;font-weight:500;color:var(--fg-2);transition:color var(--lm-fast),background var(--lm-base) var(--lm-ease)}
.seg button:hover{color:var(--fg)}
.seg button[aria-checked="true"]{background:var(--action);color:var(--on-action);font-weight:600;box-shadow:0 4px 12px -4px rgb(0 0 0 / .35)}
.seg.sm button{height:30px;font-size:.82rem}

/* ---------- Tabs (2px underline, muted to ink) ---------- */
.tabs{border-bottom:1px solid var(--line)}
.head .tabs{border-bottom:0}
.tabs button{font-size:.94rem;font-weight:500;color:var(--fg-2);transition:color var(--lm-fast),background var(--lm-fast)}
.tabs button:hover{background:transparent;color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--fg);font-weight:600}
.tabs button[aria-selected="true"]::after{height:2px;border-radius:2px;width:min(64px,calc(100% - 16px));background:var(--accent);bottom:-1px}

/* ---------- Badges (mono, with a dot) ---------- */
.chip{font-size:.78rem;border:1px solid var(--line-strong);padding:4px 10px;color:var(--fg-sec);gap:6px}
.chip.acc{border-color:transparent;background:transparent;padding-inline:0 4px;color:var(--link)}
.chip.acc:not(:has(svg))::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}

/* ---------- Surfaces ---------- */
.box{border-radius:var(--lm-r-xl);background:var(--bg-2);border-color:var(--line);box-shadow:var(--lm-elev-1)}
.box h2{padding:16px 18px 8px}
.box-row{padding:12px 18px}
.box-row:hover,.box-more:hover{background:color-mix(in srgb,var(--fg) 4%,transparent)}
.box-more{padding:14px 18px;font-weight:500}
.side .box.promo{background:var(--action);color:var(--on-action);border-color:transparent}
.side .box.promo p{color:color-mix(in srgb,var(--on-action) 78%,transparent)}
.side .box.promo .btn-acc{background:var(--accent);color:var(--on-accent)}
.banner-note,.ctx-note,.calm-chip{border:1px solid var(--line-strong);border-left:4px solid var(--label);border-radius:var(--lm-r-md);background:var(--surface,var(--bg))}
.ctx-note{border-left-color:var(--official)}
.calm-chip{margin:10px 12px;border-left-color:var(--accent);background:var(--bg)}
.mode-note,.preview-note{border-radius:var(--lm-r-md)}
.card,.cards .card{border-radius:var(--lm-r-lg);border-color:var(--line);background:var(--surface,var(--bg))}

/* Post cards: Larkmoor card radius and the long soft elevation */
.post .p-text{color:var(--fg);line-height:1.5}
.post-head .nm{font-weight:600}
.ph-l2,.post-head .hd,.post-head .tm{color:var(--fg-2)}
.act{color:var(--fg-2)}
.act.lk.on,.act.lk:hover{color:var(--like)}
.act.rp.on,.act.rp:hover{color:var(--repost)}
.act.bm.on,.act.bm:hover{color:var(--gold)}
.act.bm.on .ic,.act.bm:hover .ic{background:color-mix(in srgb,var(--gold) 14%,transparent)}
.post-head .more:hover{background:var(--bg-2);color:var(--fg)}

/* ---------- Dialog and sheet ---------- */
.overlay{background:var(--overlay);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.sheet{border-radius:var(--lm-r-xl) var(--lm-r-xl) 0 0;border:1px solid var(--line);border-bottom:0;box-shadow:var(--shadow);animation:lmSheet var(--lm-slow) var(--lm-ease)}
@media (min-width:700px){.sheet{border-radius:var(--lm-r-xl);border-bottom:1px solid var(--line);animation:lmDialog var(--lm-slow) var(--lm-ease)}}
@keyframes lmSheet{from{transform:translateY(40px);opacity:.4}}
@keyframes lmDialog{from{transform:translateY(12px) scale(.98);opacity:0}}

/* ---------- Header, nav and tab bar ---------- */

.nav-item[aria-current="page"] svg{color:var(--accent)}
:root[data-mesa="light"] .nav-item[aria-current="page"] svg,:root:not([data-mesa]) .nav-item[aria-current="page"] svg{color:var(--fg)}

}

/* ===== Feed cards, rebuilt on a 4px spacing grid =====
   Header row: avatar, name and handle, menu. Body runs the full card width.
   Actions sit on a hairline at the bottom. Phone gutter 12px, desktop 16px. */
/* first card and section spacing */
/* layout inside the card */
/* polls: neutral, Larkmoor field shape */
.poll{gap:8px}
.poll .opt{height:40px;border-radius:12px}

/* ===== Research pass: foundations =====
   Type: Apple HIG text styles (body 17, subheadline 15, footnote 13 on iPhone); Rello et al., CHI 2016 (readability rises with size up to 18pt).
   Targets: Apple HIG 44pt minimum; WCAG 2.2 2.5.8 (24px floor).
   Motion: NN/g, 100-500ms, simple feedback near 100ms. */
@media (max-width:699px){html{font-size:calc(var(--fs) + 1px)}}
.p-text{font-size:1.0625rem;line-height:1.42;letter-spacing:-.003em}

.acts{margin:2px 0 -8px -8px;max-width:460px}
.post-head .more{position:relative}
.post-head .more::after{content:"";position:absolute;inset:-5px}

/* motion tokens */
.sheet{animation-duration:280ms!important}

#toast{animation-duration:220ms!important}
@media (max-width:699px){#tabbar .tb-ind{transition-duration:320ms!important}}
/* loading: post-shaped placeholders, slow left-to-right shimmer, shown only after 300ms (Nielsen response-time limits) */
.skel{height:auto;min-height:112px;border-bottom:1px solid var(--line);position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 20px 20px,var(--bg-3) 19.5px,transparent 20px) 4px 12px/40px 40px no-repeat,
    linear-gradient(var(--bg-3),var(--bg-3)) 56px 18px/32% 12px no-repeat,
    linear-gradient(var(--bg-3),var(--bg-3)) 56px 42px/calc(100% - 72px) 12px no-repeat,
    linear-gradient(var(--bg-3),var(--bg-3)) 56px 62px/calc(100% - 120px) 12px no-repeat,
    linear-gradient(var(--bg-3),var(--bg-3)) 56px 90px/60% 10px no-repeat;
  border-radius:0;animation:skelin .2s ease .3s both}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 0,color-mix(in srgb,var(--bg) 70%,transparent) 50%,transparent 100%);transform:translateX(-100%);animation:skelsh 1.6s ease-in-out .3s infinite}
@keyframes skelin{from{opacity:0}}

/* long-form reading measure: 50-75 characters (Baymard, Dyson) */

if (matchMedia('(prefers-reduced-motion: reduce)').matches && !(S.prefs.look && S.prefs.look.motion)) S.prefs.look = {...(S.prefs.look || {}), motion:'reduce'};
applyLook(look());

/* ============ Model ============ */
const prof = id => S.profiles[id] || {id, handle:'unknown', name:'Unknown account'};
const me = () => S.profiles[S.uid];
const badgeFor = p => (p.official ? orgBadge : (p.human ? humanBadge : '')) + affBadge(p);

const visible = p => p && (p.createdAt <= now() || p.author === S.uid) && !(p.author !== S.uid && S.profiles[p.author] && S.profiles[p.author].deactivated);
const allPosts = () => Object.values(S.posts).filter(visible);
const publicPost = p => (!p.table || p.carry) && !p.removed;
function followingSet(){ const f = new Set([S.uid]); const m = me(); if (m && m.following) for (const [k, v] of Object.entries(m.following)) if (v) f.add(k); return f; }
const isFollowing = id => on(me()?.following, id);

const byHandle = h => Object.values(S.profiles).find(p => (p.handle || '').toLowerCase() === String(h).toLowerCase());
function idx(){
  if (idx.c && idx.v === S._ver) return idx.c;
  const replies = {}, quotes = {};
  for (const p of allPosts()) { if (p.replyTo) (replies[p.replyTo] ||= []).push(p); if (p.quoteOf) (quotes[p.quoteOf] ||= []).push(p); }
  idx.v = S._ver; idx.c = {replies, quotes}; return idx.c;
}
function muted(p){
  if (!p || p.author === S.uid) return false;
  if (on(S.prefs.mutedUsers, p.author)) return true;
  const words = S.prefs.mutedWords || [];
  if (!words.length) return false;
  const t = (p.text || '').toLowerCase();
  return words.some(w => w && t.includes(w.toLowerCase()));
}
function publishedNotes(p){
  return Object.entries(p.notes || {}).map(([id, n]) => ({id, ...n})).filter(n => {
    const r = Object.entries(n.ratings || {}).filter(([u]) => u !== n.by);
    const up = r.filter(([, v]) => v === 1).length, dn = r.filter(([, v]) => v === -1).length;

  });
}
const pendingNotes = p => { const pub = new Set(publishedNotes(p).map(n => n.id)); return Object.entries(p.notes || {}).map(([id, n]) => ({id, ...n})).filter(n => !pub.has(n.id)); };
function canReply(p){
  if (!p || !S.uid) return false;
  const a = p.audience || 'everyone';
  if (p.author === S.uid || a === 'everyone') return true;
  if (a === 'human') return !!me()?.human;
  if (a === 'following') return on(prof(p.author).following, S.uid);
  if (a === 'mentioned') return new RegExp('@' + reEsc(me()?.handle || '\u0000') + '\\b', 'i').test(p.text || '');

}
function audienceLine(p){
  const a = p.audience || 'everyone';
  if (a === 'following') return `People @${prof(p.author).handle} follows can reply`;
  return AUD[a] || AUD.everyone;
}

/* ============ Data layer ============ */
const live = () => S.mode === 'live';
function bump(){ S._ver++; scheduleRender(); }
async function putPost(id, d){ if (live()) await db.doc('posts/' + id).set(d); else { S.posts[id] = {id, ...d}; bump(); } }
async function patchPost(id, d){ if (live()) await db.doc('posts/' + id).update(d); else { S.posts[id] = deepMerge(S.posts[id], d); bump(); } }

async function putProfile(id, d){ if (live()) await db.doc('profiles/' + id).set(d); else { S.profiles[id] = {id, ...d}; bump(); } }
async function patchProfile(id, d){ if (live()) await db.doc('profiles/' + id).update(d); else { S.profiles[id] = deepMerge(S.profiles[id], d); bump(); } }

async function patchTable(id, d){ if (live()) await db.doc('tables/' + id).update(d); else { S.tables[id] = deepMerge(S.tables[id], d); bump(); } }
async function patchPrefs(patch, replace){
  const next = deepMerge(S.prefs, patch);
  if (replace) for (const k of replace) next[k] = patch[k];
  S.prefs = next; scheduleRender();
  if (live() && S.uid) { try { await db.doc(prefsPath()).set(JSON.parse(JSON.stringify(next))); } catch (e) { toast(errMsg(e)); } }
}
async function run(fn){ try { await fn(); } catch (e) { console.error(e); toast(errMsg(e)); } }

/* ============ Boot & accounts ============ */
/* S.person is the signed-in person; S.uid is the Mouawa account they are using right now.
   Which accounts a person owns, and which are logged out, live in their private session doc. */
S.person = null; S.session = {active:null, loggedOut:{}, accounts:{}}; S.sessionLoaded = false;
const prefsPath = () => S.uid === S.person ? `data/users/${S.person}/prefs` : `data/users/${S.person}/prefs_${S.uid}`;
const ownedAccounts = () => Object.values(S.profiles).filter(p => p.id === S.person || on(S.session.accounts, p.id));
const loggedIn = () => ownedAccounts().filter(p => !on(S.session.loggedOut, p.id) && !p.deactivated);
async function boot(){
  render();
  const c = window.claude;
  if (c && typeof c.use === 'function') {
    try { [db, userCap, assets] = await Promise.all([c.use('db'), c.use('user'), c.use('assets')]); } catch (e) { db = null; }
  }
  if (userCap) { try { const m = await userCap.me(); S.person = m.id; S.myName = m.name || ''; } catch (e) {} }
  if (db && S.person) { S.mode = 'live'; subscribe(); }
  else { S.mode = 'local'; S.person = S.person || 'local-you'; S.loaded = {posts:true, profiles:true}; S.sessionLoaded = true; }
  render(); roomSetup();
}
function subscribe(){
  db.collection('posts').orderBy('createdAt', 'desc').limit(1000).onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => { m[d.id] = {id:d.id, ...d.data()}; }); S.posts = m; S.loaded.posts = true; bump();
  }, () => toast('Lost the live connection. Reload to reconnect.'));
  db.collection('profiles').onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => { m[d.id] = {id:d.id, ...d.data()}; }); S.profiles = m; S.loaded.profiles = true; pickAccount(); bump(); resolveAvatars();
  }, () => {});
  subscribeMore();
  db.collection('tables').onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => { m[d.id] = {id:d.id, ...d.data()}; }); S.tables = m; bump();
  }, () => {});
  db.doc(`data/users/${S.person}/session`).onSnapshot(snap => {
    const d = snap.exists ? snap.data() : {};
    S.session = {active:d.active || null, loggedOut:d.loggedOut || {}, accounts:d.accounts || {}}; S.sessionLoaded = true; pickAccount(); scheduleRender();
  }, () => { S.sessionLoaded = true; pickAccount(); });
}
let prefsUnsub = null;
function subPrefs(){
  if (prefsUnsub) { prefsUnsub(); prefsUnsub = null; }
  S.prefs = {...DEFAULT_PREFS, look:S.prefs.look};
  dmSetup(); loadOtherPrefs(); setPresence(null);
  if (!live() || !S.uid) return;
  prefsUnsub = db.doc(prefsPath()).onSnapshot(snap => {
    const remote = snap.exists ? snap.data() : {}, localLook = S.prefs.look;
    S.prefs = {...DEFAULT_PREFS, ...remote};
    if (!(remote.look && remote.look.v === 2) && localLook) S.prefs.look = localLook;
    applyLook(look()); scheduleRender();
  }, () => {});
}
function pickAccount(){
  if (!S.loaded.profiles || !S.sessionLoaded) return;
  const li = loggedIn();
  const want = S.session.active && li.some(p => p.id === S.session.active) ? S.session.active : (li[0] ? li[0].id : null);
  if (want !== S.uid) { S.uid = want; subPrefs(); S.history = []; S.inline = null; render(); }
}
async function saveSession(patch){
  const cur = S.session;
  S.session = {active:'active' in patch ? patch.active : cur.active, loggedOut:{...(cur.loggedOut || {}), ...(patch.loggedOut || {})}, accounts:{...(cur.accounts || {}), ...(patch.accounts || {})}};
  if (live()) { try { await db.doc(`data/users/${S.person}/session`).set(JSON.parse(JSON.stringify(S.session))); } catch (e) { toast(errMsg(e)); } }
}
async function switchAccount(id, quiet){
  await saveSession({active:id, loggedOut:{[id]:0}});
  S.uid = id; subPrefs(); S.history = []; S.view = 'home'; S.inline = null; S.creating = false;
  stopMorsels(); render(); window.scrollTo(0, 0);
  if (!quiet) toast(`You’re now using @${prof(id).handle}`);
}
async function logOut(id){
  const others = loggedIn().filter(p => p.id !== id);
  const leaving = id === S.uid;
  await saveSession({loggedOut:{[id]:now()}, active:leaving ? (others[0] ? others[0].id : null) : S.session.active});
  if (leaving) { S.uid = others[0] ? others[0].id : null; subPrefs(); S.view = 'home'; S.history = []; S.inline = null; stopMorsels(); }
  render(); toast(`Logged out of @${prof(id).handle}`);
}
async function resolveAvatars(){
  if (!userCap) return;
  const ids = Object.keys(S.profiles).filter(id => id !== 'mesa' && !id.startsWith('local'));
  if (!ids.length) return;
  try {
    const ps = await userCap.profiles(ids); let ch = false;
    for (const id of ids) { const u = ps[id] && ps[id].name ? ps[id].avatarUrl : null; if (u && S.avatars[id] !== u) { S.avatars[id] = u; ch = true; } }
    if (ch) scheduleRender();
  } catch (e) {}
}

/* ============ Render scheduling ============ */
let pending = false;
function typing(){ const a = document.activeElement; return a && ($('#main').contains(a) || $('#side').contains(a)) &&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName); }
function scheduleRender(){ if (typing()) { pending = true; return; } render(); }
document.addEventListener('focusout', () => { if (pending) setTimeout(() => { if (pending && !typing()) { pending = false; render(); } }, 0); });

/* ============ Small parts ============ */
const initials = p => (p.name || p.handle || '?').trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
function avatar(uid, sz = ''){
  const cls = 'av' + (sz ? ' ' + sz : '');
  if (uid === 'mesa') return `<span class="${cls} mesa" aria-hidden="true">${logo(sz === 's128' ? 64 : sz === 's24' ? 15 : sz === 's32' ? 20 : 24)}</span>`;
  const p = prof(uid);
  if (assetOk(p.avatar)) return `<img class="${cls}" src="https://qmqdznhtdhpbtgxtovcq.supabase.co/storage/v1/object/public/blobs/${esc(p.avatar)}" alt="">`;
  if (S.avatars[uid]) return `<img class="${cls}" src="${esc(S.avatars[uid])}" alt="">`;
  return `<span class="${cls}" style="--avc:${hex(p.color) || AV_COLORS[1]}" aria-hidden="true">${esc(initials(p))}</span>`;

function richText(t){
  let h = esc(t);
  h = h.replace(/(https?:\/\/[^\s<]+)/g, u => `<a class="lnk" href="${u}" target="_blank" rel="noopener noreferrer">${u.replace(/^https?:\/\/(www\.)?/, '').slice(0, 34)}${u.length > 44 ? '…' : ''}</a>`);
  h = h.replace(/(^|[\s(])#([A-Za-z][A-Za-z0-9_]{0,39})/g, (m, a, tag) => `${a}<button class="lnk" data-act="search" data-q="#${tag}">#${tag}</button>`);
  h = h.replace(/(^|[\s(])@([A-Za-z0-9_]{1,15})/g, (m, a, hd) => `${a}<button class="lnk" data-act="handle" data-h="${hd.toLowerCase()}">@${hd}</button>`);
  return h;
}
const hideCounts = () => S.prefs.hideCounts || (S.view === 'home' && S.prefs.calmMode);
function act(kind, cls, id, icon, label, n, isOn, extra = ''){

  return `<button class="act ${cls}${isOn ? ' on' : ''}${kind === 'like' && S.popId === id ? ' pop' : ''}" data-act="${kind}" data-id="${id}" aria-label="${label}${show ? ', ' + n : ''}" ${extra}><span class="ic">${ic(icon, 19)}</span>${show ? `<span>${fmtN(n)}</span>` : ''}</button>`;
}
function actionsRow(t){
  const ix = idx(), replies = (ix.replies[t.id] || []).length, rq = cnt(t.reposts) + (ix.quotes[t.id] || []).length;

    ${act('repost', 'rp', t.id, 'repost', on(t.reposts, S.uid) ? 'Undo repost or quote' : 'Repost or quote', rq, on(t.reposts, S.uid), 'aria-haspopup="dialog"')}
    ${act('like', 'lk', t.id, 'heart', liked ? 'Unlike' : 'Like', cnt(t.likes), liked, `aria-pressed="${liked}"`)}
    ${act('save', 'bm', t.id, 'bookmark', saved ? 'Remove bookmark' : 'Bookmark', 0, saved, `aria-pressed="${saved}"`)}

}
function mediaHTML(t){
  const m = (t.media || []).filter(x => assetOk(x.id)).slice(0, 4);
  if (!m.length) return '';
  return `<div class="media n${m.length}">${m.map(x => `<div class="m"><img src="https://qmqdznhtdhpbtgxtovcq.supabase.co/storage/v1/object/public/blobs/${esc(x.id)}" alt="${esc(x.alt || '')}" loading="lazy">${x.alt ? `<button class="alt-b" data-act="alt" data-alt="${esc(x.alt)}" aria-label="Image description">ALT</button>` : ''}</div>`).join('')}</div>`;
}
function pollHTML(t){
  const p = t.poll; if (!p || !Array.isArray(p.options)) return '';
  const votes = Object.entries(t.votes || {}).filter(([, v]) => Number.isInteger(v) && v >= 0 && v < p.options.length);
  const total = votes.length, mine = (t.votes || {})[S.uid], ended = now() > p.ends;
  const counts = p.options.map((_, i) => votes.filter(([, v]) => v === i).length), max = Math.max(...counts);
  const showRes = ended || Number.isInteger(mine) || t.author === S.uid;
  const left = p.ends - now(), lefttxt = ended ? 'Final results' : left > 864e5 ? `${Math.ceil(left / 864e5)} days left` : left > 36e5 ? `${Math.ceil(left / 36e5)} hours left` : `${Math.max(1, Math.ceil(left / 6e4))} minutes left`;

}

/* ============ Post ============ */
function postCard(item, o = {}){
  let t = item, reposter = null;
  if (item.repostOf) { t = S.posts[item.repostOf]; reposter = item.author; if (!t || !visible(t)) return ''; }
  if (!o.noMute && muted(t)) return '';
  const a = prof(t.author), parent = t.replyTo ? S.posts[t.replyTo] : null;
  const notes = S.prefs.showContext ? publishedNotes(t) : [];
  const q = t.quoteOf ? S.posts[t.quoteOf] : null;
  const long = !o.full && (t.text || '').length > LONG;
  const chips = [];
  if (item.why) chips.push(`<span class="chip acc">${esc(item.why)}</span>`);
  if (t.imported) chips.push(`<span class="chip">From X · ${new Date(t.createdAt).toLocaleDateString(undefined, {month:'short', year:'numeric'})}</span>`);
  if (t.threadCount > 1) chips.push(`<span class="chip">${ic('list', 13)} Thread of ${t.threadCount}</span>`);
  if (t.createdAt > now() && !t.undo) chips.push(`<span class="chip acc">${ic('clock', 13)} Scheduled for ${esc(fullDate(t.createdAt))}</span>`);
  const tb = t.table ? tbl(t.table) : null, inTable = tb && (S.view === 'table' || S.view === 'post');
  if (t.morsel && S.view !== 'morsels') chips.push(`<span class="chip">${ic('play', 13)} Video</span>`);
  const ctx = reposter ? `<div class="ctx-line">${ic('repost', 15, 2.2)}<span>${reposter === S.uid ? 'You' : esc(prof(reposter).name)} reposted</span></div>`
    : o.pinned ? `<div class="ctx-line">${ic('pin', 15, 2.2)}<span>Pinned</span></div>`
    : tb && S.view !== 'table' ? `<div class="ctx-line"><button class="lnk" style="color:var(--fg-2);display:inline-flex;align-items:center;gap:10px;font-weight:600" data-act="open-table" data-id="${esc(tb.id)}">${ic('users', 15, 2.2)}${esc(tb.name)}</button></div>` : '';
  if (t.removed && t.table) return `<article class="post muted" style="cursor:default">This post was removed by the moderators of ${esc(commName(t.table))}.</article>`;
  return `<article class="post${o.threaded ? ' threaded' : ''}" data-open="${t.id}" aria-label="Post by ${esc(a.name)}">
    ${ctx}
    <div class="post-row">
      <div class="post-av"><button data-act="profile" data-uid="${esc(t.author)}" aria-label="${esc(a.name)}’s profile">${avatar(t.author)}</button></div>
      <div style="min-width:0">
        <div class="post-head"><span class="ph-who"><span class="ph-l1"><button class="nm" data-act="profile" data-uid="${esc(t.author)}">${esc(a.name)}</button>${badgeFor(a)}${inTable ? ringBadge(tb.id, t.author) : ''}</span><span class="ph-l2"><span class="hd">@${esc(a.handle)}</span><span class="muted" aria-hidden="true">·</span><button class="tm" data-act="open" data-id="${t.id}" title="${esc(fullDate(t.createdAt))}">${ago(t.createdAt)}</button>${t.editedAt ? `<button class="tm" data-act="history" data-id="${t.id}" aria-label="Edited. See history">· edited</button>` : ''}</span></span><button class="ibtn more" data-act="more" data-id="${t.id}" aria-label="More options" aria-haspopup="dialog">${ic('more', 18)}</button></div>
        ${parent && !o.inThread ? `<div class="replying">Replying to <button class="lnk" data-act="profile" data-uid="${esc(parent.author)}">@${esc(prof(parent.author).handle)}</button></div>` : ''}
        ${t.article ? articleCard(t) : `<div class="p-text">${richText(long ? t.text.slice(0, LONG).replace(/\s+\S*$/, '') + '…' : t.text)}</div>`}
        ${long ? `<button class="show-more" data-act="open" data-id="${t.id}">Show more</button>` : ''}
        ${mediaHTML(t)}${videoHTML(t)}${pollHTML(t)}
        ${q && visible(q) && canSee(q) ? `<div class="quote" data-open="${q.id}"><div class="post-head">${avatar(q.author, 's24')}<span class="nm">${esc(prof(q.author).name)}</span>${badgeFor(prof(q.author))}<span class="hd">@${esc(prof(q.author).handle)} · ${ago(q.createdAt)}</span></div><div class="p-text">${richText(q.text.length > 280 ? q.text.slice(0, 280) + '…' : q.text)}</div>${mediaHTML(q)}</div>` : t.quoteOf ? `<div class="quote muted">This post is unavailable.</div>` : ''}
        ${notes.length ? `<div class="ctx-note" data-open="${t.id}">${ic('info', 18, 2)}<div><b>Readers added context</b>${esc(notes[0].text.slice(0, 160))}${notes[0].text.length > 160 ? '…' : ''}</div></div>` : ''}
        ${chips.length ? `<div class="chips">${chips.join('')}</div>` : ''}

/* ============ Feeds ============ */
function score(p){ const h = (now() - p.createdAt) / 3.6e6; return (cnt(p.likes) * 2 + cnt(p.reposts) * 3 + (idx().replies[p.id] || []).length * 2 + 1) / Math.pow(h + 2, 1.3); }
function discoverItems(){
  const fs = followingSet();
  return allPosts().filter(p => !p.replyTo && !p.repostOf && !p.imported && !fs.has(p.author) && !muted(p) && publicPost(p))
    .map(p => {
      const lb = Object.entries(p.likes || {}).find(([u, v]) => v && fs.has(u) && u !== S.uid);
      const why = lb ? `Liked by @${prof(lb[0]).handle}, who you follow` : (cnt(p.likes) + cnt(p.reposts) > 0 ? 'Popular on Mouawa this week' : 'New voice on Mouawa');
      return {...p, why, _s:score(p) * (lb ? 2 : 1)};
    }).sort((a, b) => b._s - a._s);
}
function timelineOf(authors, calm){
  let items = allPosts().filter(p => !p.replyTo && !p.imported && authors.has(p.author) && p.createdAt <= now() && (p.repostOf || publicPost(p))).sort((a, b) => b.createdAt - a.createdAt);
  const seen = new Set(), out = [];
  for (const p of items) { const k = p.repostOf || p.id; if (seen.has(k)) continue; seen.add(k); out.push(p); }
  return calm ? out.filter(p => { const t = p.repostOf ? S.posts[p.repostOf] : p; return t && !heated(t.text); }) : out;
}
function homeItems(){
  if (String(S.tab).startsWith('list:')) return listTabItems(S.tab.slice(5));
  if (S.tab === 'discover') return discoverItems();
  let items = timelineOf(followingSet(), S.tab === 'calm' && S.prefs.calm);
  if (S.prefs.commInHome !== false) {
    const joined = new Set(Object.values(S.tables).filter(isMember).map(t => t.id)), have = new Set(items.map(p => p.repostOf || p.id));
    const extra = allPosts().filter(p => p.table && joined.has(p.table) && !p.replyTo && !p.removed && !have.has(p.id) && p.createdAt <= now() && !muted(p) && !(S.tab === 'calm' && S.prefs.calm && heated(p.text)));
    if (extra.length) items = items.concat(extra).sort((a, b) => b.createdAt - a.createdAt);
  }
  if (S.tab === 'following' && S.prefs.blend > 0) {
    const every = Math.round(100 / S.prefs.blend), extra = discoverItems().slice(0, 25), out = []; let j = 0;
    items.forEach((p, i) => { out.push(p); if ((i + 1) % every === 0 && extra[j]) out.push({...extra[j++], why:`New voice · your feed blends in ${S.prefs.blend}%`}); });
    items = out;
  }
  return items;
}

/* ============ Notifications ============ */
function notifs(){
  const out = [], m = me(); if (!m) return out;

  const mention = new RegExp('(^|[\\s(])@' + reEsc(m.handle) + '\\b', 'i');

  }
  c.poll = null; rerenderComposer(key);
}

function impStatus(){

  if (i.status === 'working') return `<div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Import progress"><i style="width:${pct}%"></i></div><p class="hint">${esc(i.msg)}</p>`;

async function importArchive(file){
  if (!file) return;
  if (typeof JSZip === 'undefined') { S.imp = {status:'error', msg:'The importer didn’t load. Reload the page and try again.'}; return render(); }
  S.imp = {status:'working', done:0, total:0, msg:'Reading your archive…'}; renderImp();
  try {
    const zip = await JSZip.loadAsync(file), names = Object.keys(zip.files);
    const tf = names.filter(n => /(^|\/)data\/tweets?(-part\d+)?\.js$/i.test(n));
    if (!tf.length) throw new Error('NOPOSTS');
    const tweets = [];
    for (const n of tf) { const t = await zip.file(n).async('string'); tweets.push(...JSON.parse(t.slice(t.indexOf('['))).map(x => x.tweet || x)); }
    let username = null;
    const an = names.find(n => /(^|\/)data\/account\.js$/i.test(n));
    if (an) { try { const t = await zip.file(an).async('string'); username = JSON.parse(t.slice(t.indexOf('[')))[0]?.account?.username || null; } catch (e) {} }
    const dec = s => s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
    const clean = tw => { let x = tw.full_text || tw.text || ''; for (const u of (tw.entities?.urls || [])) if (u.url && u.expanded_url) x = x.split(u.url).join(u.expanded_url); for (const m of (tw.entities?.media || tw.extended_entities?.media || [])) if (m.url) x = x.split(m.url).join(''); return dec(x).trim().slice(0, MAX_LEN); };
    const keep = tweets.filter(t => t && (t.full_text || t.text) && !/^RT @/.test(t.full_text || t.text) && !t.in_reply_to_status_id_str && !t.in_reply_to_status_id)
      .map(t => ({xid:String(t.id_str || t.id).replace(/[^0-9]/g, ''), at:Date.parse(t.created_at) || now(), text:clean(t)}))
      .filter(t => t.text && t.xid).sort((a, b) => b.at - a.at).slice(0, S.impLimit).filter(t => !S.posts['x_' + t.xid]);
    S.imp.total = keep.length;
    if (!keep.length) { S.imp = {status:'done', msg:'Everything in this archive is already on Mouawa.'}; return renderImp(); }
    for (const t of keep) { await putPost('x_' + t.xid, {author:S.uid, text:t.text, createdAt:Math.min(t.at, now()), imported:true, xId:t.xid, audience:'everyone'}); S.imp.done++; S.imp.msg = `Copied ${S.imp.done} of ${S.imp.total} posts`; renderImp(); }
    const patch = {importedAt:now()}; if (username && !me()?.xHandle) patch.xHandle = username;
    await patchProfile(S.uid, patch);
    S.imp = {status:'done', msg:`Done. ${keep.length} posts from X are on your profile with their original dates.`};
  } catch (e) {
    console.error(e);
    S.imp = {status:'error', msg:e && e.code ? errMsg(e) : e && e.message === 'NOPOSTS' ? 'No posts found in that file. Use the .zip X sends from “Download an archive of your data”.' : 'We couldn’t read that file. Use the whole .zip archive from X, not a file from inside it.'};
  }
  render();
}

/* ============ Passwords & log in ============ */
/* Passwords are never stored. We keep a salted PBKDF2-SHA256 hash (310,000 rounds) per account in 'creds'. */
S.creds = {}; S.loginFails = 0; S.loginLock = 0;
async function pwHash(pw, saltB64, iter){
  const salt = saltB64 ? unb64(saltB64) : crypto.getRandomValues(new Uint8Array(16));
  const key = await subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await subtle.deriveBits({name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'}, key, 256);
  return {salt:b64(salt), hash:b64(bits), iter};
}
async function setPassword(acct, pw){
  const d = {...await pwHash(pw, null, 310000), at:now()};
  if (live()) await db.doc('creds/' + acct).set(d); else S.creds[acct] = d;
  await patchProfile(acct, {hasPassword:true});
}
async function getCreds(acct){
  if (!live()) return S.creds[acct] || null;
  const snap = await db.doc('creds/' + acct).get(); return snap.exists ? snap.data() : null;
}
async function checkPassword(acct, pw){
  const c = await getCreds(acct); if (!c || !c.salt) return null;
  const h = await pwHash(pw, c.salt, c.iter || 310000);
  let diff = h.hash.length ^ c.hash.length; for (let i = 0; i < Math.min(h.hash.length, c.hash.length); i++) diff |= h.hash.charCodeAt(i) ^ c.hash.charCodeAt(i);
  return diff === 0;
}

  if (S.modal) closeModal();
  await switchAccount(id, !!prof(id).deactivated);
  if (!prof(id).hasPassword) setTimeout(() => toast('Tip: set a password in Settings › Your account to protect this account.'), 1800);
}

async function submitLogin(){
  const err = m => { const e = $('#lg-err'); if (e) e.textContent = m; };
  if (now() < S.loginLock) return err(`Too many tries. Wait ${Math.ceil((S.loginLock - now()) / 1000)} seconds and try again.`);

  if (p.id === S.uid) return err(`You’re already logged in as @${h}.`);
  if (!subtle) return err('This browser can’t check passwords securely.');
  const btn = document.querySelector('#login-form button[type=submit]'); if (btn) { btn.disabled = true; btn.textContent = 'Checking…'; }
  try {
    const ok = await checkPassword(p.id, pw);

      if (isOwned(p.id)) return finishLogin(p.id);
      return err('This account hasn’t set a password yet. Log in where it was created and add one in Settings.');

    if (!pw) return err('Enter your password.');
    if (!ok) { S.loginFails++; if (S.loginFails >= 5) { S.loginLock = now() + 30000; S.loginFails = 0; } return err('Wrong password. Check it and try again.'); }
    await finishLogin(p.id);
  } catch (e) { console.error(e); err('Logging in didn’t work. Check your connection and try again.'); }
  finally { const b = document.querySelector('#login-form button[type=submit]'); if (b) { b.disabled = false; b.textContent = 'Log in'; } }
}

async function safetyCode(c){
  const keys = c.members.map(u => (prof(u).dmKey || {})).map(k => (k.x || '') + (k.y || '')).sort().join('|');

  let digits = ''; for (let i = 0; i < 15; i++) digits += String((h[i * 2] << 8 | h[i * 2 + 1]) % 100).padStart(2, '0');
  return digits.slice(0, 30).match(/.{5}/g).join(' ');
}

let feedObs = null;
function setupFeedVideos(){
  if (feedObs) { feedObs.disconnect(); feedObs = null; }
  const vids = [...document.querySelectorAll('video[data-feedv]')]; if (!vids.length) return;
  feedObs = new IntersectionObserver(es => es.forEach(en => { const v = en.target; if (en.isIntersecting && en.intersectionRatio >= .6) { if (S.prefs.autoplay !== false && !S.modal) { v.muted = !S.feedSound; v.play().catch(() => {}); } } else v.pause(); }), {threshold:[0, .6]});
  vids.forEach(v => feedObs.observe(v));
}
function addVideo(key, f){
  const c = draftOf(key);
  if (!/^video\/(mp4|webm|quicktime)$/.test(f.type)) return toast('Use an MP4, WebM or MOV video.');
  if (f.size > MORSEL_MB * 1048576) return toast(`That video is over ${MORSEL_MB} MB.`);
  const url = URL.createObjectURL(f), v = document.createElement('video');
  v.preload = 'metadata'; v.muted = true;
  v.onloadedmetadata = () => { const d = v.duration; if (!isFinite(d) || d > MORSEL_MAX + .5) { URL.revokeObjectURL(url); return toast(`Videos can be up to ${MORSEL_MAX / 60} minutes.`); } c.video = {file:f, local:url, dur:d}; c.media = []; c.poll = null; rerenderComposer(key); };
  v.onerror = () => { URL.revokeObjectURL(url); toast('That video couldn’t be read. Try another file.'); };
  v.src = url;
}

async function loadOtherPrefs(){
  if (!live() || !S.person) return;
  for (const p of loggedIn()) {
    if (p.id === S.uid) continue;
    try { const path = p.id === S.person ? `data/users/${S.person}/prefs` : `data/users/${S.person}/prefs_${p.id}`; const snap = await db.doc(path).get(); DM.otherPrefs[p.id] = snap.exists ? snap.data() : {}; } catch (e) {}
  }
  renderChrome();
}
function notifCountFor(acct){

      ${loggedIn().length > 1 ? `<button class="acct-link out" style="color:var(--danger)" data-act="logout-all">Log out of all accounts</button>` : ''}

        <div class="field"><label for="rs-pw2">Confirm new password</label><input id="rs-pw2" class="input" type="password" autocomplete="new-password" maxlength="128"></div>

      : sheet('Forgot password?', `<div class="sheet-b"><p style="margin:0">${hdl ? `@${esc(hdl)} wasn’t created on this sign-in, so it can’t be reset from here.` : 'Type your username in the login form first, then tap Forgot password.'}</p><p class="muted" style="margin:0">If you created the account somewhere else, log in there and change the password in Settings › Your account. Resetting by email is coming with Mouawa’s full launch.</p></div>`, {sm:true});

    h = proModalHTML();
  } else if (m.type === 'drawer') {
    h = drawerHTML();
  } else if (EXTRA_MODALS[m.type]) {
    h = EXTRA_MODALS[m.type](m);
  } else if (m.type === 'shortcuts') {
    h = sheet('Keyboard shortcuts', `<div class="sheet-b">${[['N','New post'],['/','Search'],['Ctrl + Enter','Send post'],['Esc','Close a window']].map(([k, l]) => `<div class="toggle-row"><div class="grow"><b>${l}</b></div><kbd>${k}</kbd></div>`).join('')}</div>`, {sm:true});
  }
  root.innerHTML = `<div class="overlay" data-act="overlay">${h}</div>`;
  root.querySelectorAll('textarea[data-part]').forEach(autosize);
  const f = root.querySelector('textarea, input:not(.sr), select, .menu-i, button:not([data-act="close"])');
  if (f && m.type !== 'drawer') setTimeout(() => f.focus(), 30);
}

async function putDoc(c, id, d){ if (live()) await db.doc(`${c}/${id}`).set(d); else { S[c][id] = {id, ...d}; bump(); } }
async function patchDoc(c, id, d){ if (live()) await db.doc(`${c}/${id}`).update(d); else { S[c][id] = deepMerge(S[c][id], d); bump(); } }
async function delDoc(c, id){ if (live()) await db.doc(`${c}/${id}`).delete(); else { delete S[c][id]; bump(); } }
function subscribeMore(){
  for (const c of Object.keys(COLL)) db.collection(c).onSnapshot(snap => { const m = {}; snap.docs.forEach(d => { m[d.id] = {id:d.id, ...d.data()}; }); S[c] = m; bump(); }, () => {});
}
const money = (n, cur = 'USD') => { try { return new Intl.NumberFormat(undefined, {style:'currency', currency:cur, maximumFractionDigits:n % 1 ? 2 : 0}).format(n); } catch (e) { return '$' + n; } };
async function uploadImages(files){ const out = []; for (const f of files) { const r = await assets.upload(f); out.push(r.id); } return out; }
function pickImages(input, max){
  const files = [...(input.files || [])].filter(f => /^image\/(png|jpeg|gif|webp)$/.test(f.type) && f.size <= 20 * 1048576).slice(0, max);
  if (files.length < (input.files || []).length) toast('Some files were skipped. Use PNG, JPG, GIF or WebP under 20 MB.');
  return files.map(f => ({file:f, local:URL.createObjectURL(f)}));
}

const liveStories = () => Object.values(S.stories).filter(s => s.expires > now() && visible({createdAt:s.at, author:s.author}) && !on(S.prefs.mutedUsers, s.author));
function storyAuthors(){
  const fs = followingSet(), by = {};
  for (const s of liveStories()) if (fs.has(s.author)) (by[s.author] ||= []).push(s);
  Object.values(by).forEach(l => l.sort((a, b) => a.at - b.at));
  const seen = S.prefs.storySeen || {};
  return Object.entries(by).map(([u, l]) => ({u, l, unseen:l.some(s => !seen[s.id])})).sort((a, b) => (a.u === S.uid ? -1 : b.u === S.uid ? 1 : 0) || (b.unseen - a.unseen) || (b.l[b.l.length - 1].at - a.l[a.l.length - 1].at));
}

    <div role="listitem"><button class="st-item" data-act="${mine ? 'story-open' : 'story-new'}" data-uid="${esc(S.uid)}"><span class="st-ring${mine && mine.unseen ? ' new' : mine ? ' seen' : ''}">${avatar(S.uid, 's48')}${mine ? '' : `<span class="st-plus">${ic('plus', 12, 3)}</span>`}</span><span class="st-name">Your story</span></button></div>
    ${mine ? `<div role="listitem"><button class="st-item" data-act="story-new"><span class="st-ring add">${ic('plus', 22, 2.4)}</span><span class="st-name">Add</span></button></div>` : ''}
    ${list.filter(x => x.u !== S.uid).map(x => `<div role="listitem"><button class="st-item" data-act="story-open" data-uid="${esc(x.u)}" aria-label="${esc(prof(x.u).name)}\u2019s story${x.unseen ? ', new' : ''}"><span class="st-ring${x.unseen ? ' new' : ' seen'}">${avatar(x.u, 's48')}</span><span class="st-name">${esc(prof(x.u).name.split(' ')[0])}</span></button></div>`).join('')}

let storyTimer = null;
EXTRA_MODALS['story-view'] = m => {
