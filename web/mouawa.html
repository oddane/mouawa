  let items = timelineOf(followingSet(), S.tab === 'calm' && S.prefs.calm);
  if (S.prefs.commInHome !== false) {
    const joined = new Set(Object.values(S.tables).filter(isMember).map(t => t.id)), have = new Set(items.map(p => p.repostOf || p.id));
    const extra = allPosts().filter(p => p.table && joined.has(p.table) && !p.replyTo && !p.removed && !have.has(p.id) && p.createdAt <= now() && !muted(p) && !(S.tab === 'calm' && S.prefs.calm && heated(p.text)));
    if (extra.length) items = items.concat(extra).sort((a, b) => b.createdAt - a.createdAt);
  }

function notifs(){

  const mention = new RegExp('(^|[\\s(])@' + reEsc(m.handle) + '\\b', 'i');
  for (const p of allPosts()) {
    if (p.createdAt > now()) continue;
    if (p.author === S.uid) {
      if (!p.repostOf) {
        for (const [u, ts] of Object.entries(p.likes || {})) if (ts && u !== S.uid && !on(S.prefs.mutedUsers, u)) out.push({type:'like', at:ts, by:u, post:p.id});
        for (const n of Object.values(p.notes || {})) if (n.by !== S.uid) out.push({type:'context', at:n.at, by:n.by, post:p.id});
        for (const [u, v] of Object.entries(p.votes || {})) if (u !== S.uid && Number.isInteger(v) && p.voteAt && p.voteAt[u]) out.push({type:'vote', at:p.voteAt[u], by:u, post:p.id});

    if (muted(p)) continue;
    if (p.repostOf && mine.has(p.repostOf)) out.push({type:'repost', at:p.createdAt, by:p.author, post:p.repostOf});
    else if (p.replyTo && mine.has(p.replyTo)) out.push({type:'reply', at:p.createdAt, by:p.author, post:p.id, mention:true});
    else if (p.quoteOf && mine.has(p.quoteOf)) out.push({type:'quote', at:p.createdAt, by:p.author, post:p.id, mention:true});
    else if (!p.repostOf && mention.test(p.text || '')) out.push({type:'mention', at:p.createdAt, by:p.author, post:p.id, mention:true});
  }
  for (const p of Object.values(S.profiles)) { const ts = p.following && p.following[S.uid]; if (ts && p.id !== S.uid) out.push({type:'follow', at:ts, by:p.id}); }

  return `<p style="color:var(--repost);font-weight:600;margin:0">${esc(i.msg)}</p><div><button class="btn btn-line" data-act="profile" data-uid="${esc(S.uid)}">See them on your profile</button></div>`;

async function importArchive(file){
  if (!file) return;
  if (typeof JSZip === 'undefined') { S.imp = {status:'error', msg:'The importer didn’t load. Reload the page and try again.'}; return render(); }
  S.imp = {status:'working', done:0, total:0, msg:'Reading your archive…'}; renderImp();
  try {
    const zip = await JSZip.loadAsync(file), names = Object.keys(zip.files);
    const tf = names.filter(n => /(^|\/)data\/tweets?(-part\d+)?\.js$/i.test(n));
    if (!tf.length) throw new Error('NOPOSTS');
    const tweets = [];
    for (const n of tf) { const t = await zip.file(n).async('string'); tweets.push(...JSON.parse(t.slice(t.indexOf('['))).map(x => x.tweet || x)); }
    let username = null;
    const an = names.find(n => /(^|\/)data\/account\.js$/i.test(n));
    if (an) { try { const t = await zip.file(an).async('string'); username = JSON.parse(t.slice(t.indexOf('[')))[0]?.account?.username || null; } catch (e) {} }
    const dec = s => s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
    const clean = tw => { let x = tw.full_text || tw.text || ''; for (const u of (tw.entities?.urls || [])) if (u.url && u.expanded_url) x = x.split(u.url).join(u.expanded_url); for (const m of (tw.entities?.media || tw.extended_entities?.media || [])) if (m.url) x = x.split(m.url).join(''); return dec(x).trim().slice(0, MAX_LEN); };
    const keep = tweets.filter(t => t && (t.full_text || t.text) && !/^RT @/.test(t.full_text || t.text) && !t.in_reply_to_status_id_str && !t.in_reply_to_status_id)
      .map(t => ({xid:String(t.id_str || t.id).replace(/[^0-9]/g, ''), at:Date.parse(t.created_at) || now(), text:clean(t)}))
      .filter(t => t.text && t.xid).sort((a, b) => b.at - a.at).slice(0, S.impLimit).filter(t => !S.posts['x_' + t.xid]);
    S.imp.total = keep.length;
    if (!keep.length) { S.imp = {status:'done', msg:'Everything in this archive is already on Mouawa.'}; return renderImp(); }
    for (const t of keep) { await putPost('x_' + t.xid, {author:S.uid, text:t.text, createdAt:Math.min(t.at, now()), imported:true, xId:t.xid, audience:'everyone'}); S.imp.done++; S.imp.msg = `Copied ${S.imp.done} of ${S.imp.total} posts`; renderImp(); }
    const patch = {importedAt:now()}; if (username && !me()?.xHandle) patch.xHandle = username;
    await patchProfile(S.uid, patch);
    S.imp = {status:'done', msg:`Done. ${keep.length} posts from X are on your profile with their original dates.`};
  } catch (e) {
    console.error(e);
    S.imp = {status:'error', msg:e && e.code ? errMsg(e) : e && e.message === 'NOPOSTS' ? 'No posts found in that file. Use the .zip X sends from “Download an archive of your data”.' : 'We couldn’t read that file. Use the whole .zip archive from X, not a file from inside it.'};
  }
  render();
}

/* ============ Passwords & log in ============ */
/* Passwords are never stored. We keep a salted PBKDF2-SHA256 hash (310,000 rounds) per account in 'creds'. */
S.creds = {}; S.loginFails = 0; S.loginLock = 0;
async function pwHash(pw, saltB64, iter){
  const salt = saltB64 ? unb64(saltB64) : crypto.getRandomValues(new Uint8Array(16));
  const key = await subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await subtle.deriveBits({name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'}, key, 256);
  return {salt:b64(salt), hash:b64(bits), iter};
}
async function setPassword(acct, pw){
  const d = {...await pwHash(pw, null, 310000), at:now()};
  if (live()) await db.doc('creds/' + acct).set(d); else S.creds[acct] = d;
  await patchProfile(acct, {hasPassword:true});
}
async function getCreds(acct){
  if (!live()) return S.creds[acct] || null;
  const snap = await db.doc('creds/' + acct).get(); return snap.exists ? snap.data() : null;
}
async function checkPassword(acct, pw){
  const c = await getCreds(acct); if (!c || !c.salt) return null;
  const h = await pwHash(pw, c.salt, c.iter || 310000);
  let diff = h.hash.length ^ c.hash.length; for (let i = 0; i < Math.min(h.hash.length, c.hash.length); i++) diff |= h.hash.charCodeAt(i) ^ c.hash.charCodeAt(i);
  return diff === 0;
}

}

async function submitLogin(){
  const err = m => { const e = $('#lg-err'); if (e) e.textContent = m; };
  if (now() < S.loginLock) return err(`Too many tries. Wait ${Math.ceil((S.loginLock - now()) / 1000)} seconds and try again.`);

}

async function safetyCode(c){
  const keys = c.members.map(u => (prof(u).dmKey || {})).map(k => (k.x || '') + (k.y || '')).sort().join('|');

  let digits = ''; for (let i = 0; i < 15; i++) digits += String((h[i * 2] << 8 | h[i * 2 + 1]) % 100).padStart(2, '0');
  return digits.slice(0, 30).match(/.{5}/g).join(' ');
}

let feedObs = null;
function setupFeedVideos(){
  if (feedObs) { feedObs.disconnect(); feedObs = null; }
  const vids = [...document.querySelectorAll('video[data-feedv]')]; if (!vids.length) return;
  feedObs = new IntersectionObserver(es => es.forEach(en => { const v = en.target; if (en.isIntersecting && en.intersectionRatio >= .6) { if (S.prefs.autoplay !== false && !S.modal) { v.muted = !S.feedSound; v.play().catch(() => {}); } } else v.pause(); }), {threshold:[0, .6]});
  vids.forEach(v => feedObs.observe(v));
}
function addVideo(key, f){
  const c = draftOf(key);
  if (!/^video\/(mp4|webm|quicktime)$/.test(f.type)) return toast('Use an MP4, WebM or MOV video.');
  if (f.size > MORSEL_MB * 1048576) return toast(`That video is over ${MORSEL_MB} MB.`);
  const url = URL.createObjectURL(f), v = document.createElement('video');
  v.preload = 'metadata'; v.muted = true;
  v.onloadedmetadata = () => { const d = v.duration; if (!isFinite(d) || d > MORSEL_MAX + .5) { URL.revokeObjectURL(url); return toast(`Videos can be up to ${MORSEL_MAX / 60} minutes.`); } c.video = {file:f, local:url, dur:d}; c.media = []; c.poll = null; rerenderComposer(key); };
  v.onerror = () => { URL.revokeObjectURL(url); toast('That video couldn’t be read. Try another file.'); };
  v.src = url;
}

async function loadOtherPrefs(){
  if (!live() || !S.person) return;
  for (const p of loggedIn()) {
    if (p.id === S.uid) continue;
    try { const path = p.id === S.person ? `data/users/${S.person}/prefs` : `data/users/${S.person}/prefs_${p.id}`; const snap = await db.doc(path).get(); DM.otherPrefs[p.id] = snap.exists ? snap.data() : {}; } catch (e) {}
  }
  renderChrome();
}
function notifCountFor(acct){

      ${loggedIn().length > 1 ? `<button class="acct-link out" style="color:var(--danger)" data-act="logout-all">Log out of all accounts</button>` : ''}

        <div class="field"><label for="rs-pw2">Confirm new password</label><input id="rs-pw2" class="input" type="password" autocomplete="new-password" maxlength="128"></div>

      : sheet('Forgot password?', `<div class="sheet-b"><p style="margin:0">${hdl ? `@${esc(hdl)} wasn’t created on this sign-in, so it can’t be reset from here.` : 'Type your username in the login form first, then tap Forgot password.'}</p><p class="muted" style="margin:0">If you created the account somewhere else, log in there and change the password in Settings › Your account. Resetting by email is coming with Mouawa’s full launch.</p></div>`, {sm:true});

    h = proModalHTML();
  } else if (m.type === 'drawer') {
    h = drawerHTML();
  } else if (EXTRA_MODALS[m.type]) {
    h = EXTRA_MODALS[m.type](m);
  } else if (m.type === 'shortcuts') {
    h = sheet('Keyboard shortcuts', `<div class="sheet-b">${[['N','New post'],['/','Search'],['Ctrl + Enter','Send post'],['Esc','Close a window']].map(([k, l]) => `<div class="toggle-row"><div class="grow"><b>${l}</b></div><kbd>${k}</kbd></div>`).join('')}</div>`, {sm:true});
  }
  root.innerHTML = `<div class="overlay" data-act="overlay">${h}</div>`;
  root.querySelectorAll('textarea[data-part]').forEach(autosize);
  const f = root.querySelector('textarea, input:not(.sr), select, .menu-i, button:not([data-act="close"])');
  if (f && m.type !== 'drawer') setTimeout(() => f.focus(), 30);
}

async function putDoc(c, id, d){ if (live()) await db.doc(`${c}/${id}`).set(d); else { S[c][id] = {id, ...d}; bump(); } }
async function patchDoc(c, id, d){ if (live()) await db.doc(`${c}/${id}`).update(d); else { S[c][id] = deepMerge(S[c][id], d); bump(); } }
async function delDoc(c, id){ if (live()) await db.doc(`${c}/${id}`).delete(); else { delete S[c][id]; bump(); } }
function subscribeMore(){
  for (const c of Object.keys(COLL)) db.collection(c).onSnapshot(snap => { const m = {}; snap.docs.forEach(d => { m[d.id] = {id:d.id, ...d.data()}; }); S[c] = m; bump(); }, () => {});
}
const money = (n, cur = 'USD') => { try { return new Intl.NumberFormat(undefined, {style:'currency', currency:cur, maximumFractionDigits:n % 1 ? 2 : 0}).format(n); } catch (e) { return '$' + n; } };
async function uploadImages(files){ const out = []; for (const f of files) { const r = await assets.upload(f); out.push(r.id); } return out; }
function pickImages(input, max){
  const files = [...(input.files || [])].filter(f => /^image\/(png|jpeg|gif|webp)$/.test(f.type) && f.size <= 20 * 1048576).slice(0, max);
  if (files.length < (input.files || []).length) toast('Some files were skipped. Use PNG, JPG, GIF or WebP under 20 MB.');
  return files.map(f => ({file:f, local:URL.createObjectURL(f)}));
}

const liveStories = () => Object.values(S.stories).filter(s => s.expires > now() && visible({createdAt:s.at, author:s.author}) && !on(S.prefs.mutedUsers, s.author));
function storyAuthors(){
  const fs = followingSet(), by = {};
  for (const s of liveStories()) if (fs.has(s.author)) (by[s.author] ||= []).push(s);
  Object.values(by).forEach(l => l.sort((a, b) => a.at - b.at));
  const seen = S.prefs.storySeen || {};
  return Object.entries(by).map(([u, l]) => ({u, l, unseen:l.some(s => !seen[s.id])})).sort((a, b) => (a.u === S.uid ? -1 : b.u === S.uid ? 1 : 0) || (b.unseen - a.unseen) || (b.l[b.l.length - 1].at - a.l[a.l.length - 1].at));
}

    <div role="listitem"><button class="st-item" data-act="${mine ? 'story-open' : 'story-new'}" data-uid="${esc(S.uid)}"><span class="st-ring${mine && mine.unseen ? ' new' : mine ? ' seen' : ''}">${avatar(S.uid, 's48')}${mine ? '' : `<span class="st-plus">${ic('plus', 12, 3)}</span>`}</span><span class="st-name">Your story</span></button></div>
    ${mine ? `<div role="listitem"><button class="st-item" data-act="story-new"><span class="st-ring add">${ic('plus', 22, 2.4)}</span><span class="st-name">Add</span></button></div>` : ''}
    ${list.filter(x => x.u !== S.uid).map(x => `<div role="listitem"><button class="st-item" data-act="story-open" data-uid="${esc(x.u)}" aria-label="${esc(prof(x.u).name)}\u2019s story${x.unseen ? ', new' : ''}"><span class="st-ring${x.unseen ? ' new' : ' seen'}">${avatar(x.u, 's48')}</span><span class="st-name">${esc(prof(x.u).name.split(' ')[0])}</span></button></div>`).join('')}

let storyTimer = null;
EXTRA_MODALS['story-view'] = m => {

  return `<div class="story-view" role="dialog" aria-modal="true" aria-label="${esc(p.name)}\u2019s story">
    <div class="sv-bars">${l.map((x, k) => `<span class="sv-bar"><i style="width:${k < i ? 100 : 0}%"${k === i ? ' class="run"' : ''}></i></span>`).join('')}</div>
    <div class="sv-head">${avatar(s.author, 's32')}<b>${esc(p.name)}</b><span>${ago(s.at)}</span><span style="flex:1"></span>${mine ? `<span>${cnt(s.views)} ${cnt(s.views) === 1 ? 'view' : 'views'}</span><button class="ibtn" data-act="story-del" data-id="${esc(s.id)}" aria-label="Delete story" style="color:#fff">${ic('trash', 18, 2)}</button>` : ''}<button class="ibtn" data-act="close" aria-label="Close" style="color:#fff">${ic('close', 22, 2.4)}</button></div>
    <div class="sv-stage" style="background:${hex(s.bg) || '#0F1419'}">${s.media && assetOk(s.media) ? `<img src="https://qmqdznhtdhpbtgxtovcq.supabase.co/storage/v1/object/public/blobs/${esc(s.media)}" alt="${esc(s.alt || '')}">` : ''}${s.text ? `<p class="sv-text${s.media ? ' cap' : ''}">${esc(s.text)}</p>` : ''}</div>
    <button class="sv-nav prev" data-act="story-step" data-uid="${esc(m.uid)}" data-i="${i - 1}" aria-label="Previous"></button><button class="sv-nav next" data-act="story-step" data-uid="${esc(m.uid)}" data-i="${i + 1}" aria-label="Next"></button>
    ${mine ? '' : `<div class="sv-foot"><button class="pillbtn" data-act="story-like" data-id="${esc(s.id)}" aria-pressed="${liked}" style="${liked ? 'color:#FF7AA8' : ''}">${ic('heart', 16, 2)} ${liked ? 'Liked' : 'Like'}</button><button class="pillbtn" data-act="story-reply" data-uid="${esc(s.author)}">${ic('mail', 16, 2)} Reply in a message</button></div>`}
  </div>`;

function openStory(uid, i = 0){
  const a = storyAuthors().find(x => x.u === uid); if (!a) return;
  if (i < 0) i = 0;
  if (i >= a.l.length) { const all = storyAuthors(), k = all.findIndex(x => x.u === uid), nx = all[k + 1]; clearTimeout(storyTimer); if (nx) return openStory(nx.u, 0); return closeModal(); }

function pruneSeen(){ const o = {}; for (const [k, v] of Object.entries(S.prefs.storySeen || {})) if (v > now() - 2 * 864e5) o[k] = v; return o; }

function evDateBox(ts){ const d = new Date(ts); return `<span class="ev-date" aria-hidden="true"><b>${d.toLocaleDateString(undefined, {month:'short'}).toUpperCase()}</b><span>${d.getDate()}</span></span>`; }
const evWhen = e => `${new Date(e.start).toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'})} \u00b7 ${new Date(e.start).toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit'})}${e.end ? '\u2013' + new Date(e.end).toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit'}) : ''}`;
function evCard(e){
  const g = cnt(e.going), mine = on(e.going, S.uid) ? 'going' : on(e.interested, S.uid) ? 'interested' : '';
  return `<div class="ev-card" data-act="ev-open" data-id="${esc(e.id)}" role="link" tabindex="0">${evDateBox(e.start)}<div class="grow"><span class="ev-when">${esc(evWhen(e))}</span><b>${esc(e.title)}</b><span class="muted">${e.online ? 'Online' : esc(e.place || 'Location to be announced')} \u00b7 ${g} going${e.table && tbl(e.table) ? ` \u00b7 ${esc(tbl(e.table).name)}` : ''}</span></div>${mine ? `<span class="chip acc">${mine === 'going' ? 'Going' : 'Interested'}</span>` : ''}</div>`;
}
EXTRA_VIEWS.events = () => {
  const tabs = [['upcoming','Upcoming'],['going','Going'],['hosting','Hosting'],['past','Past']], tab = S.evTab || 'upcoming';
  let list = Object.values(S.events).filter(e => e.title && !e.cancelled || (e.cancelled && e.host === S.uid));
  if (tab === 'upcoming') list = list.filter(e => (e.end || e.start) >= now()).sort((a, b) => a.start - b.start);
  else if (tab === 'going') list = list.filter(e => (on(e.going, S.uid) || on(e.interested, S.uid)) && (e.end || e.start) >= now()).sort((a, b) => a.start - b.start);

function mdInline(s){
  return s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]{1,120})\]\((https?:\/\/[^\s)"<>]+)\)/g, (m, t, u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>`);
}
function md(src){
  const blocks = esc(src || '').split(/\n{2,}/);
  return blocks.map(b => {
    if (/^### /.test(b)) return `<h3>${mdInline(b.slice(4))}</h3>`;
    if (/^## /.test(b)) return `<h2>${mdInline(b.slice(3))}</h2>`;
    if (/^&gt; /.test(b)) return `<blockquote>${mdInline(b.replace(/^&gt; ?/gm, '')).replace(/\n/g, '<br>')}</blockquote>`;
    if (/^- /.test(b)) return `<ul>${b.split('\n').map(l => `<li>${mdInline(l.replace(/^- /, ''))}</li>`).join('')}</ul>`;
    if (/^\d+\. /.test(b)) return `<ol>${b.split('\n').map(l => `<li>${mdInline(l.replace(/^\d+\. /, ''))}</li>`).join('')}</ol>`;
    return `<p>${mdInline(b).replace(/\n/g, '<br>')}</p>`;
  }).join('');
}

/* ---------- Achievements ---------- */
function myStats(uid = S.uid){
  const mine = allPosts().filter(p => p.author === uid && !p.repostOf), ix = idx();
  const days = new Set(mine.map(p => new Date(p.createdAt).toDateString()));
  let streak = 0; const d = new Date(); if (!days.has(d.toDateString())) d.setDate(d.getDate() - 1);
  while (days.has(d.toDateString())) { streak++; d.setDate(d.getDate() - 1); }
  return {
    posts:mine.filter(p => !p.replyTo).length, replies:mine.filter(p => p.replyTo).length,
    likes:mine.reduce((n, p) => n + cnt(p.likes), 0), reposts:mine.reduce((n, p) => n + cnt(p.reposts), 0),
    gotReplies:mine.reduce((n, p) => n + (ix.replies[p.id] || []).filter(r => r.author !== uid).length, 0),
    followers:followersOf(uid).length, following:Object.entries(prof(uid).following || {}).filter(([k, v]) => v && k !== uid).length,
    photos:mine.filter(p => (p.media || []).length).length, videos:mine.filter(p => p.morsel).length, polls:mine.filter(p => p.poll).length,
    articles:mine.filter(p => p.article).length, threads:mine.filter(p => p.threadCount > 1).length,
    comms:Object.values(S.tables).filter(t => t && (t.head === uid || on(t.members, uid))).length, founded:Object.values(S.tables).filter(t => t && t.head === uid).length,
    events:Object.values(S.events).filter(e => e.host === uid).length,
    stories:Object.values(S.stories).filter(s => s.author === uid).length, notes:allPosts().reduce((n, p) => n + Object.values(p.notes || {}).filter(x => x.by === uid).length, 0),
    imported:mine.filter(p => p.imported).length, pro:!!(prof(uid).pro && prof(uid).pro.type), streak, days:days.size
  };
}

function parseQ(q){
  const o = {terms:[], phrases:[], not:[], anyG:[], from:'', to:'', has:[], minLikes:0, minReposts:0, minReplies:0, since:0, until:0, ops:0};
  const s = String(q).replace(/\(([^()]+)\)/g, (m0, inner) => { if (/\sOR\s/i.test(inner)) { o.anyG.push(inner.split(/\s+OR\s+/i).map(x => x.replace(/"/g, '').trim().toLowerCase()).filter(Boolean)); o.ops++; return ' '; } return ' ' + inner + ' '; });
  const re = /(-?)"([^"]+)"|(\S+)/g; let m;
  while ((m = re.exec(s))) {
    if (m[2] !== undefined) { (m[1] ? o.not : o.phrases).push(m[2].toLowerCase()); o.ops++; continue; }
    const lt = m[3].toLowerCase(); let mm;
    if ((mm = lt.match(/^from:@?(\w{1,15})$/))) { o.from = mm[1]; o.ops++; }
    else if ((mm = lt.match(/^to:@?(\w{1,15})$/))) { o.to = mm[1]; o.ops++; }
    else if ((mm = lt.match(/^(?:has|filter):(media|images|videos?|polls?|links|articles?|follows|replies)$/))) { o.has.push(mm[1]); o.ops++; }
    else if ((mm = lt.match(/^min_(faves|likes|retweets|reposts|replies):(\d+)$/))) { const n = Number(mm[2]); if (/faves|likes/.test(mm[1])) o.minLikes = n; else if (/re(tweets|posts)/.test(mm[1])) o.minReposts = n; else o.minReplies = n; o.ops++; }
    else if ((mm = lt.match(/^(since|until):(\d{4}-\d{2}-\d{2})$/))) { const t = new Date(mm[2] + 'T00:00:00').getTime(); if (!isNaN(t)) { o[mm[1]] = mm[1] === 'until' ? t + 864e5 : t; o.ops++; } }
    else if (lt === 'or' || lt === 'and') {}
    else if (lt.length > 1 && lt.startsWith('-')) { o.not.push(lt.slice(1)); o.ops++; }
    else o.terms.push(lt);

function matchQ(p, o){
  const lt = ((p.text || '') + (p.article ? ' ' + p.article.title + ' ' + p.article.body : '')).toLowerCase(), h = (prof(p.author).handle || '').toLowerCase();
  for (const w of o.terms) { if (w.startsWith('@') ? !(lt.includes(w) || h === w.slice(1)) : !lt.includes(w)) return false; }
  for (const ph of o.phrases) if (!lt.includes(ph)) return false;
  for (const n of o.not) if (lt.includes(n)) return false;
  for (const g of o.anyG) if (!g.some(w => lt.includes(w))) return false;
  if (o.from && h !== o.from) return false;
  if (o.to) { const par = p.replyTo && S.posts[p.replyTo]; if (!par || (prof(par.author).handle || '').toLowerCase() !== o.to) return false; }
  for (const x of o.has) {
    if (/^(media|images)$/.test(x) && !((p.media || []).length || p.morsel)) return false;
    if (/^video/.test(x) && !p.morsel) return false;
    if (/^poll/.test(x) && !p.poll) return false;
    if (x === 'links' && !/https?:\/\//.test(p.text || '')) return false;
    if (/^article/.test(x) && !p.article) return false;
    if (x === 'follows' && !followingSet().has(p.author)) return false;
    if (x === 'replies' && !p.replyTo) return false;
  }
  if (o.minLikes && cnt(p.likes) < o.minLikes) return false;
  if (o.minReposts && cnt(p.reposts) < o.minReposts) return false;
  if (o.minReplies && (idx().replies[p.id] || []).length < o.minReplies) return false;

    const e = $('#lg-err'), err = (m, html) => { if (e) { if (html) e.innerHTML = m; else e.textContent = m; } };
    if (!v || !pw) return err('Enter your email or username, and your password.');
    const b = $('#login-form button[type=submit]'); if (b) { b.disabled = true; b.textContent = 'Logging in…'; }
    const done = () => { const b2 = $('#login-form button[type=submit]'); if (b2) { b2.disabled = false; b2.textContent = 'Log in'; } };
    const unconfirmed = em => { S.auth.sentTo = em || ''; err(`Confirm your email first. Tap the link we sent when you signed up.${em ? ` <button type="button" class="lnk" data-act="nv-resend">Send it again</button>` : ''}`, true); };
    try {
      if (v.includes('@') && !v.startsWith('@')) {
        if (!EMAIL_RE.test(v)) { done(); return err('That email doesn’t look right.'); }
        const r = await sb.auth.signInWithPassword({email:normEmail(v), password:pw});
        if (r.error) { done(); return /confirm/i.test(r.error.message) ? unconfirmed(normEmail(v)) : err(/rate|many/i.test(r.error.message) ? 'Too many tries. Wait a minute, then try again.' : 'That email and password don’t match.'); }
      } else {
        const h = v.replace(/^@/, '').toLowerCase();
        const r = await sb.functions.invoke('login', {body:{handle:h, password:pw}});
        let code = 'invalid_credentials'; if (r.error) { try { code = (await r.error.context.json()).error || code; } catch (x) {} }
        if (r.error || !r.data || !r.data.access_token) { done(); return code === 'email_not_confirmed' ? unconfirmed('') : err('That username and password don’t match.'); }
        const s = await sb.auth.setSession({access_token:r.data.access_token, refresh_token:r.data.refresh_token});
        if (s.error) { done(); return err('Logging in didn’t work. Try again.'); }
        NS.setItem('mouawa-want', h);
      }
      NS.setItem('mouawa-fresh', '1'); window.mouawaReload();
    } catch (x) { done(); err('We couldn’t reach Mouawa. Check your connection and try again.'); }
  };

  /* Log out: leaving the last account on the phone signs out of Supabase. */
  const _logOutN = logOut;
  logOut = async function(id){ const others = loggedIn().filter(p => p.id !== id); if (others.length) return _logOutN(id); return nativeSignOut(); };
  async function nativeSignOut(){ S.native.out = true; try { await sb.auth.signOut(); } catch (e) {} NS.setItem('mouawa-flash', 'You’re logged out'); window.mouawaReload(); }

  /* Keep username login working when a handle changes. */
  const _patchProfileN = patchProfile;
  patchProfile = async function(id, d){ const r = await _patchProfileN(id, d); if (d && d.handle && isOwned(id) && sb) sb.rpc('claim_handle', {h:d.handle}).then(() => {}, () => {}); return r; };
  const _putProfileN = putProfile;
  putProfile = async function(id, d){ const r = await _putProfileN(id, d); if (d && d.handle && S.person && sb) sb.rpc('claim_handle', {h:d.handle}).then(() => {}, () => {}); return r; };

  /* Changing the main account's email also changes the login email (Supabase sends a confirmation). */
  const _emailFormN = EXTRA_FORMS['email-form'];
  EXTRA_FORMS['email-form'] = async () => {
    const v = normEmail(($('#em-new') || {}).value);
    await _emailFormN();
    if (S.uid === S.person && EMAIL_RE.test(v) && !S.modal) {
      const r = await sb.auth.updateUser({email:v}, {emailRedirectTo:REDIRECT()});
      toast(r.error ? (r.error.message || 'Couldn’t change your login email') : `Confirm the change from the link sent to ${v}`);
    }
  };

  Object.assign(A, {
    'logout-all': () => nativeSignOut(),
    'nv-retry': () => window.mouawaReload(),
    'nv-confirmed': () => { S.showLogin = true; S.loginPrefill = S.auth.sentTo || ''; S.auth.screen = 'welcome'; S.creating = false; render(); setTimeout(() => $('#lg-pw')?.focus(), 60); },
    'nv-change': () => { S.auth.screen = 'signup'; S.auth.step = 2; S.creating = true; render(); },
    'nv-resend': async () => {
      const em = S.auth.sentTo || normEmail(($('#lg-user') || {}).value);
      if (!EMAIL_RE.test(em || '')) { toast('Enter your email first'); return; }
      const r = await sb.auth.resend({type:'signup', email:em, options:{emailRedirectTo:REDIRECT()}});
      toast(r.error ? (/rate|security/i.test(r.error.message) ? 'Wait a minute before sending another link.' : r.error.message) : `Link sent to ${em}`);
    },
    'pw-forgot': async () => {
      if (S.person) { let v = (($('#lg-user') || {}).value || '').trim(); if (v.includes('@') && !v.startsWith('@')) { try { const id = await emailOwner(v); v = id && S.profiles[id] ? S.profiles[id].handle : ''; } catch (e) { v = ''; } } openModal({type:'pw-forgot', handle:v.replace(/^@/, '').toLowerCase()}); return; }
      const v = (($('#lg-user') || {}).value || '').trim(); openModal({type:'nv-reset', email:EMAIL_RE.test(v) ? normEmail(v) : ''});
    }
  });
  EXTRA_MODALS['nv-reset'] = m => m.sent
    ? sheet('Check your email', `<div class="sheet-b"><p style="margin:0">If an account uses <b>${esc(m.email)}</b>, we sent it a link to reset the password. Open it on this phone.</p><button class="btn btn-acc btn-lg" data-act="close">Done</button></div>`, {sm:true})
    : `<form id="nv-reset-form">${sheet('Reset your password', `<div class="sheet-b"><p style="margin:0" class="muted">Enter the email on your account and we’ll send you a link to choose a new password.</p>
      <div class="field"><label for="nr-email">Email</label><input id="nr-email" class="input" type="email" inputmode="email" autocapitalize="none" spellcheck="false" maxlength="120" autocomplete="email" value="${esc(m.email || '')}"></div>
      <p class="err" id="nr-err" role="alert"></p><button class="btn btn-acc btn-lg" type="submit">Send reset link</button></div>`, {sm:true})}</form>`;
  EXTRA_FORMS['nv-reset-form'] = async () => {
    const em = normEmail($('#nr-email').value), err = m => { $('#nr-err').textContent = m; };
    if (!EMAIL_RE.test(em)) return err('Enter an email like you@example.com.');
    const r = await sb.auth.resetPasswordForEmail(em, {redirectTo:REDIRECT()});
    if (r.error && /rate|security/i.test(r.error.message)) return err('Wait a minute before asking for another link.');
    openModal({type:'nv-reset', email:em, sent:true});
  };
  EXTRA_MODALS['nv-newpw'] = () => `<form id="nv-newpw-form">${sheet('Choose a new password', `<div class="sheet-b">
    <div class="field"><label for="np-pw">New password</label><div class="pw-wrap"><input id="np-pw" class="input" type="password" autocomplete="new-password" maxlength="128"><button type="button" class="lnk pw-tg" data-act="pw-show" data-for="np-pw">Show</button></div><span class="hint">At least 8 characters. A short phrase works well.</span></div>
    <p class="err" id="np-err" role="alert"></p><button class="btn btn-acc btn-lg" type="submit">Save password</button></div>`, {sm:true})}</form>`;
  EXTRA_FORMS['nv-newpw-form'] = async () => {
    const pw = $('#np-pw').value, err = m => { $('#np-err').textContent = m; };
    if (pw.length < 8) return err('Passwords need at least 8 characters.');
    const r = await sb.auth.updateUser({password:pw});
    if (r.error) return err(r.error.message || 'That didn’t work. Try again.');
    closeModal(); toast('Password updated');
  };

  /* Android back button */
  window.__mouawaBack = () => {
    if (S.modal) { closeModal(); return; }
    if (S.history && S.history.length) { A.back(); return; }
    if (me() && S.view !== 'home') { go('home'); return; }
    if (S.creating && S.auth.step > 1) { A['au-back'](); return; }
    if (S.creating || S.showLogin || S.auth.screen === 'verify') { A['au-home'](); return; }
    if (window.mouawaPost) window.mouawaPost({t:'exit'});
  };
}

/* ============ Events ============ */
document.addEventListener('click', e => {
  if (e.target.matches('video[data-mv]')) { const v = e.target; if (S.mvFull) return; if (v.paused) v.play().catch(() => {}); else v.pause(); return; }
  if (e.target.matches('video[data-feedv]')) { const v = e.target; if (v.paused) v.play().catch(() => {}); else v.pause(); return; }
  if (e.target.closest('video')) return;
  const el = e.target.closest('[data-act]');
  if (el && !(el.dataset.act === 'overlay' && e.target !== el)) { const fn = A[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); return; } }
  if (e.target.closest('a,button,input,textarea,select,label')) return;
  const card = e.target.closest('[data-open]');
  if (card && !String(window.getSelection ? window.getSelection() : '').length) openPost(card.dataset.open);
});
$('#fab').addEventListener('click', () => { if (S.view === 'messages') return A['dm-new'](); if (innerWidth < 700) openModal({type:'create'}); else compose(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.modal) { closeModal(); return; }
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'dm-input' && !e.isComposing) { e.preventDefault(); sendDM(); return; }
  if (e.altKey && /^Digit[1-9]$/.test(e.code) && me() && !S.modal) { const li = loggedIn(), a = li[Number(e.code.slice(5)) - 1]; if (a) { e.preventDefault(); if (a.id !== S.uid) switchAccount(a.id); } return; }
  const tag = (e.target.tagName || '');
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="link"][tabindex="0"]')) { e.preventDefault(); e.target.click(); return; }
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target.dataset && e.target.dataset.ck) { e.preventDefault(); submitDraft(e.target.dataset.ck); return; }
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(tag) || e.metaKey || e.ctrlKey || e.altKey || S.modal || !me()) return;
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); compose(); }
  else if (e.key === '/') { e.preventDefault(); if (S.view !== 'explore') go('explore'); setTimeout(() => $('#q')?.focus(), 30); }
});
document.addEventListener('input', e => {
  const t = e.target, d = t.dataset;
  if (EXTRA_INPUT[t.id]) { EXTRA_INPUT[t.id](t); return; }
  if (t.id === 'q') { S.search = t.value; const r = $('#results'); if (r) r.innerHTML = exploreResults(); return; }
  if (t.id === 'side-q') return;
  if (t.id === 'pro-q') { S.proQ = t.value; const l = $('#pro-list'); if (l) l.innerHTML = proCatList(); return; }
  if (t.id === 'dm-input') { DM.drafts[S.convoId] = t.value; autosize(t); if (now() - DM.typingT > 2500) { DM.typingT = now(); setPresence(S.convoId); } clearTimeout(DM.typingClear); DM.typingClear = setTimeout(() => { DM.typingT = 0; setPresence(null); }, 4000); return; }
  if (t.id === 'dm-q') { S.dmQ = t.value; const l = $('#dm-list-body'); if (l) l.innerHTML = convoListHTML(); return; }
  if (t.id === 'dmp-q') { S.dmPickQ = t.value; const l = $('#dmp-list'); if (l) l.innerHTML = pickList(S.modal && S.modal.type === 'dm-add' ? DM.convos[S.convoId] : null); return; }
  if (t.id === 'dmp-name') { S.dmPickName = t.value; return; }
  if (t.id === 'tq') { S.tableQ = t.value; const r = $('#t-results'); if (r) r.innerHTML = tableResults(); return; }
  if (d.mvcap !== undefined && S.morsel) { S.morsel.caption = t.value; return; }
  if (t.id === 'nt-name') { const s = $('#nt-slug'); if (s && !s.dataset.touched) s.value = t.value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 24); return; }
  if (t.id === 'nt-slug') { t.dataset.touched = '1'; return; }
  if (d.look === 'size') { setLookSoft({size:Number(t.value)}); return; }
  if (d.look === 'accent') { setLookSoft({accent:t.value}); return; }
  const c = d.ck && draftOf(d.ck); if (!c) return;
  if (d.part !== undefined) { const i = Number(d.part); c.parts[i] = t.value; autosize(t); const r = $(`#${d.ck}-r${i}`); if (r) r.innerHTML = ring(t.value.length); if (c.showHeat) { c.showHeat = false; rerenderComposer(d.ck, `#${d.ck}-t${i}`); } }
  else if (d.alt !== undefined) c.media[Number(d.alt)].alt = t.value;
  else if (d.popt !== undefined) c.poll.options[Number(d.popt)] = t.value;
});
let softT = null;
function setLookSoft(patch){ const L = {...look(), ...patch}; S.prefs.look = L; applyLook(L); clearTimeout(softT); softT = setTimeout(() => patchPrefs({look:L}, ['look']), 400); const pv = $('.preview'); if (pv) pv.innerHTML = previewPost(); }
document.addEventListener('change', e => {
  const t = e.target, d = t.dataset;
  for (const k of Object.keys(d)) if (EXTRA_CHANGE[k]) EXTRA_CHANGE[k](t);
  if (d.pref === 'blend') patchPrefs({blend:Number(t.value)});
  if (d.pref === 'defaultAudience' && AUD[t.value]) patchPrefs({defaultAudience:t.value});
  if (t.id === 'dm-from' && ['everyone','following','verified','none'].includes(t.value)) run(() => patchProfile(S.uid, {dmFrom:t.value}));
  if (d.dmttl !== undefined && S.convoId) { const v = Number(t.value); run(async () => { await patchConvo(S.convoId, {ttl:v}); toast(v ? 'Disappearing messages are on' : 'Disappearing messages are off'); }); }
  if (d.vfile !== undefined && d.ck && t.files && t.files[0]) addVideo(d.ck, t.files[0]);
  if (d.pref === 'morselLimit') { patchPrefs({morselLimit:Number(t.value)}); S.mvMore = false; }
  if (d.mvfile !== undefined && t.files && t.files[0]) pickMorsel(t.files[0]);
  if (d.mvtbl !== undefined && S.morsel) S.morsel.table = t.value || null;
  if (d.carry !== undefined && d.ck && draftOf(d.ck)) draftOf(d.ck).carry = t.checked;
  if (d.tcolor !== undefined) S.ntColor = t.value;
  if (d.implimit !== undefined) S.impLimit = Number(t.value);
  if (t.id === 'archive' && t.files && t.files[0]) importArchive(t.files[0]);
  if (d.look === 'size') t.setAttribute('aria-valuetext', SIZES[Number(t.value)] + ' pixels');
  if (d.photo !== undefined && t.files && t.files[0]) uploadPhoto(t.files[0]);
  const c = d.ck && draftOf(d.ck);
  if (c) {
    if (d.file !== undefined && t.files) addFiles(d.ck, [...t.files]);
    if (d.aud !== undefined) c.audience = t.value;
    if (d.pdur !== undefined) c.poll.days = Number(t.value);
    if (d.sched !== undefined) { c.scheduleAt = t.value; rerenderComposer(d.ck); }
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'side-q' && e.target.value.trim()) { S.search = e.target.value.trim(); go('explore'); } });
async function uploadPhoto(f){
  if (!assets) return toast('Photo uploads aren’t available in this view.');
  if (!/^image\/(png|jpeg|webp)$/.test(f.type)) return toast('Use a PNG, JPG or WebP photo.');
  await run(async () => { const r = await assets.upload(f); await patchProfile(S.uid, {avatar:r.id}); toast('Profile photo updated'); renderModal(); });
}
document.addEventListener('submit', e => {
  e.preventDefault(); const id = e.target.id;
  if (EXTRA_FORMS[id]) { EXTRA_FORMS[id](e.target); return; }
  if (id === 'ob-form') submitOnboard();
  if (id === 'login-form') submitLogin();
  if (id === 'pro-form') {
    const g = x => ($('#' + x) || {}).value ? $('#' + x).value.trim() : '', err = m => { $('#pc-err').textContent = m; };
    const web = g('pc-web'), email = g('pc-email');
    if (web && !safeUrl(web)) return err('Websites need to start with https://');
    if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return err('That email doesn\u2019t look right.');
    const d = S.proDraft, pro = {type:d.type, category:d.category.slice(0, 40), contact:{website:web, email, phone:g('pc-phone').slice(0, 30), location:g('pc-loc').slice(0, 100), hours:g('pc-hours').slice(0, 100)}, showCategory:$('#pc-show').checked, since:(me().pro && me().pro.since) || now(), verify:(me().pro && me().pro.verify) || null, govLevel:(me().pro && me().pro.govLevel) || ''};
    const first = !(me().pro && me().pro.type);
    closeModal(); run(async () => { await patchProfile(S.uid, {pro}); toast(first ? `You\u2019re now a professional account: ${pro.category}` : 'Professional details saved'); if (first) go('pro'); });
  }
  if (id === 'reset-form') {
    const pw = $('#rs-pw').value, pw2 = $('#rs-pw2').value, p = byHandle(S.modal.handle), err = m => { $('#rs-err').textContent = m; };
    if (pw.length < 8) return err('Passwords need at least 8 characters.');
    if (pw !== pw2) return err('The two passwords don\u2019t match.');
    run(async () => { await setPassword(p.id, pw); toast('Password updated'); await finishLogin(p.id); });
  }
  if (id === 'pw-form') {
    const cur = $('#pw-cur') ? $('#pw-cur').value : null, pw = $('#pw-new').value, pw2 = $('#pw-new2').value, err = m => { $('#pw-err').textContent = m; };
    if (pw.length < 8) return err('Passwords need at least 8 characters.');
    if (pw !== pw2) return err('The two new passwords don\u2019t match.');
    run(async () => { if (cur !== null) { const ok = await checkPassword(S.uid, cur); if (ok === false) return err('Your current password is wrong.'); } await setPassword(S.uid, pw); toast(cur !== null ? 'Password changed' : 'Password set'); render(); });
  }
  if (id === 'dm-form') sendDM();
  if (id === 'gname-form') { const n = $('#g-name').value.trim().slice(0, 40); run(async () => { await patchConvo(S.convoId, {name:n}); toast('Group name saved'); }); }
  if (id === 'handle-form') {
    const h = $('#h-new').value.trim().replace(/^@/, '').toLowerCase(), err = m => { $('#h-err').textContent = m; };
    if (h === me().handle) return err('That\u2019s already your handle.');
    if (!/^[a-z0-9_]{2,15}$/.test(h)) return err('Handles are 2 to 15 letters, numbers or underscores.');
    if (RESERVED.includes(h) || byHandle(h)) return err(`@${h} is taken. Try another.`);
    run(async () => { await patchProfile(S.uid, {handle:h}); toast(`Your handle is now @${h}`); });
  }
  if (id === 'note-form') {
    const text = $('#n-text').value.trim(), src = $('#n-src').value.trim(), kind = $('#n-kind').value, pid = S.modal.id;
    if (text.length < 10) { $('#n-err').textContent = 'Write at least a full sentence.'; return; }
    if (src && !safeUrl(src)) { $('#n-err').textContent = 'Source links start with https://'; return; }
    const nid = newId('n'), note = {by:S.uid, kind, text, at:now(), ratings:{}}; if (src) note.source = src;
    closeModal(); run(async () => { await patchPost(pid, {notes:{[nid]:note}}); toast('Thanks. Your note is waiting for ratings.'); });
  }
  if (id === 'pf-form') {
    const name = $('#pf-name').value.trim(), bio = $('#pf-bio').value.trim(), x = $('#pf-x').value.trim().replace(/^@/, '');
    if (!name) return toast('Add your name.');
    if (x && !/^[A-Za-z0-9_]{1,15}$/.test(x)) return toast('That X username doesn’t look right.');
    closeModal(); run(async () => { await patchProfile(S.uid, {name, bio, xHandle:x}); toast('Your profile was updated'); });
  }
  if (id === 'nt-form') {
    const name = $('#nt-name').value.trim(), about = $('#nt-about').value.trim(), topic = COMM_TOPICS.includes($('#nt-topic').value) ? $('#nt-topic').value : 'General';
    const access = (document.querySelector('input[name="nt-access"]:checked') || {}).value === 'knock' ? 'knock' : 'open';
    const rules = $('#nt-rules').value.split('\n').map(s => s.trim()).filter(Boolean).slice(0, 10);
    const color = (document.querySelector('input[name="nt-color"]:checked') || {}).value || S.ntColor;
    if (name.length < 3) { $('#nt-err').textContent = 'Give your community a name of at least 3 characters.'; return; }
    let base = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 24) || 'community', slug = base, n = 2;
    while (S.tables[slug] || RESERVED.includes(slug)) slug = `${base}-${n++}`;
    const d = {name, about, topic, rules, access, color:hex(color) || TABLE_COLORS[1], head:S.uid, admins:{}, hosts:{}, members:{[S.uid]:now()}, pending:{}, createdAt:now()};
    closeModal(); run(async () => { await putTable(slug, d); toast(`${name} was created`); go('table', {tableId:slug}); });
  }
  if (id === 'tt-form') {
    const tid = S.modal.id, rules = $('#tt-rules').value.split('\n').map(s => s.trim()).filter(Boolean).slice(0, 10), topic = $('#tt-topic').value;
    closeModal(); run(async () => { await patchTable(tid, {about:$('#tt-about').value.trim(), topic:COMM_TOPICS.includes(topic) ? topic : 'General', rules, access:$('#tt-access').value === 'knock' ? 'knock' : 'open'}); toast('Community updated'); });
  }
  if (id === 'rm-form') {
    const pid = S.modal.id, reason = $('#rm-reason').value;
    closeModal(); run(async () => { await patchPost(pid, {removed:{by:S.uid, at:now(), reason}}); toast('Post removed from the community'); });
  }
  if (id === 'list-form') {
    const name = $('#l-name').value.trim(); if (!name) return toast('Give your list a name.');
    const lid = newId('l'); closeModal(); patchPrefs({lists:{...(S.prefs.lists || {}), [lid]:{name, members:{}, at:now()}}}, ['lists']); go('list', {listId:lid}); setTimeout(() => openModal({type:'manage-list', id:lid}), 50);
  }
});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => applyLook(look()));
setInterval(() => { if (!S.modal && !typing() && (S.view === 'home' || S.prefs.held)) render(); }, 60000);
boot();
})();
